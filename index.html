      color: null,
    };
    return { doc: OPS.add(doc, 'furniture', item), item };
  };
  OPS.duplicateFurniture = (doc, id) => {
    const it = OPS.byId(doc, 'furniture', id);
    if (!it) return { doc, item: null };
    const item = Object.assign({}, it, { id: U.uid('f'), x: it.x + 300, y: it.y + 300 });
    return { doc: OPS.add(doc, 'furniture', item), item };
  };
  OPS.addOpening = (doc, wallId, code, t) => {
    const w = OPS.byId(doc, 'walls', wallId);
    const s = DD.data.SCHEDULE[code];
    if (!w || !s) return { doc, opening: null };
    const L = U.dist(w.a, w.b);
    const op = {
      id: U.uid('o'),
      wall: wallId,
      code,
      type: s.type,
      t: U.clamp(t == null ? L / 2 : t, s.width / 2, Math.max(s.width / 2, L - s.width / 2)),
      width: s.width,
      height: s.height,
      sill: s.sill,
      style: s.style,
      hinge: 'start',
      side: 1,
    };
    return { doc: OPS.add(doc, 'openings', op), opening: op };
  };

  // ------------------------------------------------------------------ geometry
  const G = (DD.geom = {});

  G.wallDir = (w) => {
    const L = U.dist(w.a, w.b) || 1;
    const d = { x: (w.b.x - w.a.x) / L, y: (w.b.y - w.a.y) / L };
    return { L, d, n: { x: -d.y, y: d.x } }; // n = left normal (for a +x wall, n = +y)
  };
  /** 4 corners of a wall rectangle (clockwise on screen): a+n, b+n, b-n, a-n (n scaled by thick/2). */
  G.wallPolygon = (w) => {
    const { d, n } = G.wallDir(w);
    const h = w.thick / 2;
    void d;
    return [
      { x: w.a.x + n.x * h, y: w.a.y + n.y * h },
      { x: w.b.x + n.x * h, y: w.b.y + n.y * h },
      { x: w.b.x - n.x * h, y: w.b.y - n.y * h },
      { x: w.a.x - n.x * h, y: w.a.y - n.y * h },
    ];
  };
  /** Two faces of a wall as segments with the outward normal of each face. */
  G.wallFaces = (w) => {
    const { d, n, L } = G.wallDir(w);
    const h = w.thick / 2;
    return [
      { wall: w.id, a: { x: w.a.x + n.x * h, y: w.a.y + n.y * h }, b: { x: w.b.x + n.x * h, y: w.b.y + n.y * h }, n: { x: n.x, y: n.y }, d, L },
      { wall: w.id, a: { x: w.a.x - n.x * h, y: w.a.y - n.y * h }, b: { x: w.b.x - n.x * h, y: w.b.y - n.y * h }, n: { x: -n.x, y: -n.y }, d, L },
    ];
  };
  /** Opening frame in plan: centre, direction along wall, normal, jamb points on the centre line. */
  G.openingFrame = (w, op) => {
    const { d, n, L } = G.wallDir(w);
    const c = { x: w.a.x + d.x * op.t, y: w.a.y + d.y * op.t };
    const hw = op.width / 2;
    return {
      c, d, n, L,
      start: { x: c.x - d.x * hw, y: c.y - d.y * hw }, // jamb nearer wall.a
      end: { x: c.x + d.x * hw, y: c.y + d.y * hw }, // jamb nearer wall.b
      t0: op.t - hw,
      t1: op.t + hw,
    };
  };
  G.openingsOfWall = (doc, wallId) => doc.openings.filter((o) => o.wall === wallId).sort((a, b) => a.t - b.t);

  /**
   * Split a wall into solid boxes around its openings (for 3D and walk collision).
   * Returns [{ t0, t1, z0, z1, part: 'solid'|'sill'|'lintel', opening? }] — t along the wall from a (mm),
   * z from the floor level (mm). z1 of solids = wall.height.
   */
  G.wallPieces = (w, openings) => {
    const { L } = G.wallDir(w);
    const H = w.height;
    const ops = openings
      .filter((o) => o.wall === w.id)
      .map((o) => ({ o, s: U.clamp(o.t - o.width / 2, 0, L), e: U.clamp(o.t + o.width / 2, 0, L) }))
      .sort((a, b) => a.s - b.s);
    const out = [];
    let cur = 0;
    ops.forEach(({ o, s, e }) => {
      if (s > cur + 0.5) out.push({ t0: cur, t1: s, z0: 0, z1: H, part: 'solid' });
      const s2 = Math.max(s, cur);
      if (e > s2 + 0.5) {
        const sill = U.clamp(o.sill || 0, 0, H);
        const top = U.clamp((o.sill || 0) + o.height, 0, H);
        if (sill > 0.5) out.push({ t0: s2, t1: e, z0: 0, z1: sill, part: 'sill', opening: o.id });
        if (top < H - 0.5) out.push({ t0: s2, t1: e, z0: top, z1: H, part: 'lintel', opening: o.id });
      }
      cur = Math.max(cur, e);
    });
    if (L > cur + 0.5) out.push({ t0: cur, t1: L, z0: 0, z1: H, part: 'solid' });
    return out;
  };

  /**
   * Stair geometry of a U-stair (as drawn on the approved plan: "Espelho=18cm", 16 risers for 2,88 m).
   * Lower flight = far row (y+w/2..y+w) rising along +x with `lowerCount` treads; the landing spans both rows at
   * the far end and is step lowerCount+1 (at 1,44 m); the upper flight = near row going back along −x with
   * `upperCount` treads; the next floor is the last riser. riser = floorHeight / (lowerCount + upperCount + 2).
   * `landingLabel` is the landing's first cell, where the plan prints the step number (8).
   */
  G.stairGeometry = (st, floorHeight) => {
    const T = st.tread, W = st.width, hw = W / 2;
    const lower = Math.max(1, Math.round(st.lowerCount) || 1), upper = Math.max(1, Math.round(st.upperCount) || 1);
    const risers = lower + upper + 2;
    const r = floorHeight / risers;
    const landX = Math.min(st.x + Math.max(lower, upper) * T, st.x + st.length - T);
    const treads = [];
    for (let i = 0; i < lower; i++)
      treads.push({ n: i + 1, x0: st.x + i * T, y0: st.y + hw, x1: st.x + (i + 1) * T, y1: st.y + W, z: (i + 1) * r, flight: 0 });
    const landZ = (lower + 1) * r;
    const landing = [{ x0: landX, y0: st.y, x1: st.x + st.length, y1: st.y + W, z: landZ }];
    for (let j = 0; j < upper; j++) {
      const x1 = landX - j * T;
      treads.push({ n: lower + 2 + j, x0: x1 - T, y0: st.y, x1, y1: st.y + hw, z: (lower + 2 + j) * r, flight: 1 });
    }
    const midX = (landX + st.x + st.length) / 2;
    return {
      riser: r,
      risers,
      treads,
      landing,
      landingLabel: { n: lower + 1, x0: landX, y0: st.y + hw, x1: landX + T, y1: st.y + W, z: landZ },
      footprint: { x0: st.x, y0: st.y, x1: st.x + st.length, y1: st.y + W },
      // walk line: up the lower flight, round the landing, back along the upper flight
      walkline: [
        { x: st.x + T * 0.3, y: st.y + hw * 1.5 },
        { x: midX, y: st.y + hw * 1.5 },
        { x: midX, y: st.y + hw * 0.5 },
        { x: st.x + T * 0.3, y: st.y + hw * 0.5 },
      ],
    };
  };
  /** Height (mm above the stair's floor level) of the stair surface at (x,y), or null if outside. */
  G.stairHeightAt = (st, floorHeight, x, y) => {
    const g = G.stairGeometry(st, floorHeight);
    const f = g.footprint;
    if (x < f.x0 || x > f.x1 || y < f.y0 || y > f.y1) return null;
    let z = null;
    g.treads.concat(g.landing).forEach((t) => {
      if (x >= t.x0 && x <= t.x1 && y >= t.y0 && y <= t.y1) z = Math.max(z == null ? -1 : z, t.z);
    });
    return z == null ? 0 : z;
  };
  /** Stair openings (holes) in the slab of a floor = footprints of stairs rising from the floor below. */
  G.stairHoles = (doc, floorId) => {
    const idx = doc.floors.findIndex((f) => f.id === floorId);
    if (idx <= 0) return [];
    const below = doc.floors[idx - 1].id;
    return doc.stairs.filter((s) => s.floor === below).map((s) => ({ x0: s.x, y0: s.y, x1: s.x + s.length, y1: s.y + s.width, stair: s.id }));
  };

  /** Distance from p along unit dir to the first wall face on the floor (or Infinity). */
  G.raycastWalls = (doc, floorId, p, dir, maxDist) => {
    const far = { x: p.x + dir.x * (maxDist || 50000), y: p.y + dir.y * (maxDist || 50000) };
    let best = Infinity, hitWall = null;
    doc.walls.forEach((w) => {
      if (w.floor !== floorId) return;
      const poly = G.wallPolygon(w);
      for (let i = 0; i < 4; i++) {
        const h = U.segIntersect(p, far, poly[i], poly[(i + 1) % 4]);
        if (h) {
          const dd = Math.hypot(h.x - p.x, h.y - p.y);
          if (dd < best) {
            best = dd;
            hitWall = w.id;
          }
        }
      }
    });
    return { dist: best, wall: hitWall };
  };

  /** Footprint corners of a furniture item (clockwise on screen). */
  G.furnitureCorners = (it, x, y, rot) => {
    const cx = x == null ? it.x : x, cy = y == null ? it.y : y, r = rot == null ? it.rot : rot;
    const hw = it.w / 2, hd = it.d / 2;
    return [
      U.localToWorld(cx, cy, r, -hw, -hd),
      U.localToWorld(cx, cy, r, hw, -hd),
      U.localToWorld(cx, cy, r, hw, hd),
      U.localToWorld(cx, cy, r, -hw, hd),
    ];
  };

  /**
   * Wall adsorption for furniture. `prop` = proposed {x, y, rot}. Returns {x, y, rot, snaps:[{wall, face, side}]}.
   * If a wall face is within `threshold` mm of the item's nearest side, the item is rotated so that side is parallel
   * to the wall (the item's BACK — local -y — is preferred to face the wall when the rotation is ambiguous) and
   * translated so it touches the face. A second, perpendicular face can then snap it into a corner.
   */
  G.snapFurniture = (doc, floorId, item, prop, opts) => {
    opts = opts || {};
    const threshold = opts.threshold || 150;
    const angleTol = opts.angleTol == null ? 30 : opts.angleTol;
    const faces = [];
    doc.walls.forEach((w) => {
      if (w.floor !== floorId || w.kind === 'railing') return;
      G.wallFaces(w).forEach((f) => faces.push(f));
    });
    const res = { x: prop.x, y: prop.y, rot: prop.rot, snaps: [] };

    function extentAlong(rot, nx, ny) {
      const r = U.rad(rot);
      const ax = { x: Math.cos(r), y: Math.sin(r) }, ay = { x: -Math.sin(r), y: Math.cos(r) };
      return Math.abs((item.w / 2) * (ax.x * nx + ax.y * ny)) + Math.abs((item.d / 2) * (ay.x * nx + ay.y * ny));
    }
    function halfLenAlong(rot, ux, uy) {
      return extentAlong(rot, ux, uy);
    }
    function best(candFaces, fixedRot, excludeDir) {
      let bestC = null;
      candFaces.forEach((f) => {
        if (excludeDir && Math.abs(f.n.x * excludeDir.x + f.n.y * excludeDir.y) > 0.2) return;
        // rotation that makes the back (local -y) face the wall: back normal = -f.n  =>  (sin r, -cos r) = -n
        let rot = res.rot;
        if (!fixedRot) {
          const base = U.deg(Math.atan2(f.n.x, -f.n.y)) + 180; // back faces wall
          let bestK = null, bestDiff = 1e9;
          for (let k = 0; k < 4; k++) {
            const cand = U.normDeg(base + k * 90);
            let diff = Math.abs(U.normDeg(res.rot - cand));
            diff = Math.min(diff, 360 - diff);
            // prefer back-to-wall (k = 0) slightly
            const score = diff - (k === 0 ? 8 : 0);
            if (score < bestDiff) {
              bestDiff = score;
              bestK = cand;
            }
          }
          let realDiff = Math.abs(U.normDeg(res.rot - bestK));
          realDiff = Math.min(realDiff, 360 - realDiff);
          if (realDiff > angleTol) return;
          rot = bestK;
        }
        const e = extentAlong(rot, f.n.x, f.n.y);
        const s = (res.x - f.a.x) * f.n.x + (res.y - f.a.y) * f.n.y; // signed distance of centre from face
        const gap = s - e;
        if (s < 0 || gap > threshold) return; // centre behind the face, or too far away (any overlap snaps back)
        // must overlap the face segment along its direction
        const along = (res.x - f.a.x) * f.d.x + (res.y - f.a.y) * f.d.y;
        const hl = halfLenAlong(rot, f.d.x, f.d.y);
        if (along < -hl * 0.6 || along > f.L + hl * 0.6) return;
        // an item sunk into a wall is pushed out first; otherwise the nearest face wins
        const better = !bestC || (gap < 0 && bestC.gap < 0 ? gap < bestC.gap : gap < 0 !== bestC.gap < 0 ? gap < 0 : Math.abs(gap) < Math.abs(bestC.gap));
        if (better) bestC = { f, rot, gap };
      });
      return bestC;
    }
    const c1 = best(faces, false, null);
    if (!c1) return res;
    res.rot = c1.rot;
    res.x -= c1.f.n.x * c1.gap;
    res.y -= c1.f.n.y * c1.gap;
    res.snaps.push({ wall: c1.f.wall, n: c1.f.n });
    // corner: a face perpendicular to the first
    const perp = faces.filter((f) => Math.abs(f.n.x * c1.f.n.x + f.n.y * c1.f.n.y) < 0.2);
    const c2 = best(perp, true, null);
    if (c2) {
      res.x -= c2.f.n.x * c2.gap;
      res.y -= c2.f.n.y * c2.gap;
      res.snaps.push({ wall: c2.f.wall, n: c2.f.n });
    }
    res.x = Math.round(res.x);
    res.y = Math.round(res.y);
    return res;
  };

  /** Wall endpoints / corners on a floor for snapping (measure tool, wall drawing). */
  G.snapPoints = (doc, floorId) => {
    const pts = [];
    doc.walls.forEach((w) => {
      if (w.floor !== floorId) return;
      pts.push({ x: w.a.x, y: w.a.y, kind: 'end' }, { x: w.b.x, y: w.b.y, kind: 'end' });
      G.wallPolygon(w).forEach((p) => pts.push({ x: p.x, y: p.y, kind: 'corner' }));
    });
    return pts;
  };

  /**
   * Dimension breakpoints for the automatic dimension chains around a floor, one list per facade (like the
   * approved drawing): a wall contributes to a side only if it reaches that facade — its end looks out of the
   * building on that side (the ray from it crosses no structural/partition wall and no indoor room), directly or
   * through the facade wall it butts into. Upper floors also count railings and muros (balconies, terraces).
   * Returns { bbox, top, bottom, left, right } (x lists for top/bottom, y lists for left/right, each including the
   * bbox ends) plus the legacy aliases xs=top, xsExt=bottom, ys=left, ysExt=right. Cached per doc identity.
   */
  const dimCache = new Map();
  G.dimensionData = (doc, floorId) => {
    const c = dimCache.get(floorId);
    if (c && c.walls === doc.walls && c.seeds === doc.roomSeeds && c.seps === doc.separators && c.floors === doc.floors)
      return c.data;
    const data = computeDimensionData(doc, floorId);
    dimCache.set(floorId, { walls: doc.walls, seeds: doc.roomSeeds, seps: doc.separators, floors: doc.floors, data });
    return data;
  };
  function computeDimensionData(doc, floorId) {
    const floor = OPS.floorById(doc, floorId);
    const upper = !!floor && floor.level > 0;
    const ws = doc.walls.filter(
      (w) => w.floor === floorId && U.dist(w.a, w.b) > 1 &&
        (w.kind === 'structural' || w.kind === 'partition' || (upper && (w.kind === 'railing' || w.kind === 'muro')))
    );
    if (!ws.length) return null;
    const polys = new Map(ws.map((w) => [w.id, G.wallPolygon(w)]));
    const blockers = ws.filter((w) => w.kind === 'structural' || w.kind === 'partition');
    const bbox = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity };
    polys.forEach((poly) =>
      poly.forEach((p) => {
        bbox.minX = Math.min(bbox.minX, p.x);
        bbox.minY = Math.min(bbox.minY, p.y);
        bbox.maxX = Math.max(bbox.maxX, p.x);
        bbox.maxY = Math.max(bbox.maxY, p.y);
      })
    );
    const indoor = DD.rooms ? DD.rooms.compute(doc, floorId).filter((r) => !r.open && r.outer && !r.outdoor) : [];
    const DIRS = { top: { x: 0, y: -1 }, bottom: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
    const isVertical = (w) => Math.abs(w.a.x - w.b.x) < 1;
    const isHorizontal = (w) => Math.abs(w.a.y - w.b.y) < 1;
    const inWall = (p, id) => U.pointInPolygon(p, polys.get(id));
    // walk outwards from p until past the bbox: blocked by structural/partition walls or indoor rooms
    const rayClear = (p, dir, ignore) => {
      const reach = Math.max(bbox.maxX - bbox.minX, bbox.maxY - bbox.minY) + 200;
      for (let d = 0; d <= reach; d += 50) {
        const q = { x: p.x + dir.x * d, y: p.y + dir.y * d };
        if (q.x < bbox.minX - 1 || q.x > bbox.maxX + 1 || q.y < bbox.minY - 1 || q.y > bbox.maxY + 1) return true;
        if (blockers.some((w) => ignore.indexOf(w.id) < 0 && inWall(q, w.id))) return false;
        if (indoor.some((r) => U.pointInPolygon(q, r.outer))) return false;
      }
      return true;
    };
    const facePoint = (w, dir) => {
      // point on the wall's polygon furthest along dir (its end or face towards the side), nudged out 2 mm
      let best = null;
      polys.get(w.id).forEach((p) => {
        const v = p.x * dir.x + p.y * dir.y;
        if (!best || v > best.v + 0.5) best = { v, p };
      });
      const mid = { x: (w.a.x + w.b.x) / 2, y: (w.a.y + w.b.y) / 2 };
      const along = dir.x ? { x: best.p.x, y: mid.y } : { x: mid.x, y: best.p.y };
      return { x: along.x + dir.x * 2, y: along.y + dir.y * 2 };
    };
    const isFacade = (w, dir) => rayClear(facePoint(w, dir), dir, [w.id]);
    const reaches = (w, dir) => {
      const start = facePoint(w, dir);
      const touched = ws.find((o) => o.id !== w.id && inWall(start, o.id));
      if (!touched) return rayClear(start, dir, [w.id]);
      const perpendicular = dir.x ? isVertical(touched) : isHorizontal(touched);
      return perpendicular && isFacade(touched, dir);
    };
    const uniq = (arr, lo, hi) => {
      const out = [];
      arr.concat([lo, hi]).filter((v) => v >= lo - 1 && v <= hi + 1).sort((a, b) => a - b).forEach((v) => {
        if (!out.length || v - out[out.length - 1] > 4) out.push(Math.round(v));
      });
      return out;
    };
    const side = (name) => {
      const dir = DIRS[name];
      const vals = [];
      ws.forEach((w) => {
        const across = dir.y ? isVertical(w) : isHorizontal(w);
        // slim guards (e.g. the 50 mm steel guard at the stair void) bound the bbox but are not dimensioned
        if (!across || w.thick < 100 || !reaches(w, dir)) return;
        const c = dir.y ? w.a.x : w.a.y;
        vals.push(c - w.thick / 2, c + w.thick / 2);
      });
      return dir.y ? uniq(vals, bbox.minX, bbox.maxX) : uniq(vals, bbox.minY, bbox.maxY);
    };
    const top = side('top'), bottom = side('bottom'), left = side('left'), right = side('right');
    return { bbox, top, bottom, left, right, xs: top, xsExt: bottom, ys: left, ysExt: right };
  }

  // ------------------------------------------------------------------ rooms (automatic detection)
  // Walls are rasterised on a 10 mm grid; each room seed flood-fills its region; the region outline is traced
  // back into a rectilinear polygon. Area = cell count × 1e-4 m² (exact for walls on a 10 mm grid).
  const CELL = 10; // exact grid (mm)
  const CELL_PREVIEW = 25; // coarser grid while a gesture (e.g. a wall drag) is re-shaping rooms every frame
  const FAR = 20000; // geometry farther than this outside the lot is ignored by room detection
  const roomCache = new Map();
  const inGesture = () => !!(DD.store && DD.store.inGesture && DD.store.inGesture());
  // Scratch buffers reused between computations (a wall drag recomputes rooms every frame).
  const pool = {};
  function scratch(name, Ctor, size, fill) {
    let buf = pool[name];
    if (!buf || buf.length < size) buf = pool[name] = new Ctor(size);
    const view = buf.length === size ? buf : buf.subarray(0, size);
    view.fill(fill || 0);
    return view;
  }

  function rasterizeFloor(doc, floorId, CELL) {
    const lot = (doc.site && doc.site.lot) || { w: 9000, h: 20000 };
    const near = (p) => p.x > -FAR && p.y > -FAR && p.x < lot.w + FAR && p.y < lot.h + FAR;
    const walls = doc.walls.filter((w) => w.floor === floorId && near(w.a) && near(w.b) && U.dist(w.a, w.b) > 1);
    const seps = (doc.separators || []).filter((s) => s.floor === floorId && near(s.a) && near(s.b));
    const seeds = doc.roomSeeds.filter((s) => s.floor === floorId && near(s));
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    const grow = (p) => {
      minX = Math.min(minX, p.x);
      minY = Math.min(minY, p.y);
      maxX = Math.max(maxX, p.x);
      maxY = Math.max(maxY, p.y);
    };
    walls.forEach((w) => G.wallPolygon(w).forEach(grow));
    seeds.forEach(grow);
    seps.forEach((s) => {
      grow(s.a);
      grow(s.b);
    });
    if (!isFinite(minX)) return null;
    const x0 = Math.floor(minX / CELL) * CELL - 3 * CELL;
    const y0 = Math.floor(minY / CELL) * CELL - 3 * CELL;
    const W = Math.ceil((maxX - x0) / CELL) + 4;
    const H = Math.ceil((maxY - y0) / CELL) + 4;
    const blocked = scratch('blocked', Uint8Array, W * H, 0);
    // walls: cell centre inside the wall rectangle (half-open so adjacent walls don't double count)
    walls.forEach((w) => {
      const { d, n, L } = G.wallDir(w);
      const hT = w.thick / 2;
      const poly = G.wallPolygon(w);
      let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
      poly.forEach((p) => {
        bx0 = Math.min(bx0, p.x);
        by0 = Math.min(by0, p.y);
        bx1 = Math.max(bx1, p.x);
        by1 = Math.max(by1, p.y);
      });
      const i0 = Math.max(0, Math.floor((bx0 - x0) / CELL) - 1), i1 = Math.min(W - 1, Math.ceil((bx1 - x0) / CELL) + 1);
      const j0 = Math.max(0, Math.floor((by0 - y0) / CELL) - 1), j1 = Math.min(H - 1, Math.ceil((by1 - y0) / CELL) + 1);
      for (let j = j0; j <= j1; j++) {
        const cy = y0 + (j + 0.5) * CELL;
        for (let i = i0; i <= i1; i++) {
          const cx = x0 + (i + 0.5) * CELL;
          const rx = cx - w.a.x, ry = cy - w.a.y;
          const s = rx * d.x + ry * d.y;
          const u = rx * n.x + ry * n.y;
          if (s >= 0 && s < L && u >= -hT && u < hT) blocked[j * W + i] = 1;
        }
      }
    });
    // separators: zero-thickness barriers between neighbouring cells
    const barR = scratch('barR', Uint8Array, W * H, 0); // barrier between (i,j) and (i+1,j)
    const barD = scratch('barD', Uint8Array, W * H, 0); // barrier between (i,j) and (i,j+1)
    seps.forEach((s) => {
      const i0 = Math.max(0, Math.floor((Math.min(s.a.x, s.b.x) - x0) / CELL) - 2);
      const i1 = Math.min(W - 2, Math.ceil((Math.max(s.a.x, s.b.x) - x0) / CELL) + 2);
      const j0 = Math.max(0, Math.floor((Math.min(s.a.y, s.b.y) - y0) / CELL) - 2);
      const j1 = Math.min(H - 2, Math.ceil((Math.max(s.a.y, s.b.y) - y0) / CELL) + 2);
      for (let j = j0; j <= j1; j++)
        for (let i = i0; i <= i1; i++) {
          const p = { x: x0 + (i + 0.5) * CELL, y: y0 + (j + 0.5) * CELL };
          if (U.segIntersect(p, { x: p.x + CELL, y: p.y }, s.a, s.b)) barR[j * W + i] = 1;
          if (U.segIntersect(p, { x: p.x, y: p.y + CELL }, s.a, s.b)) barD[j * W + i] = 1;
        }
    });
    return { x0, y0, W, H, blocked, barR, barD, seeds };
  }

  function traceRegion(label, W, H, rid, bx0, by0, bx1, by1) {
    // directed boundary edges, region on the right (clockwise on screen)
    const edges = []; // [fromVertex, toVertex, dx, dy]
    const VW = W + 1;
    const inR = (i, j) => i >= 0 && j >= 0 && i < W && j < H && label[j * W + i] === rid;
    for (let j = by0; j <= by1; j++)
      for (let i = bx0; i <= bx1; i++) {
        if (label[j * W + i] !== rid) continue;
        if (!inR(i, j - 1)) edges.push([j * VW + i, j * VW + i + 1, 1, 0]);
        if (!inR(i + 1, j)) edges.push([j * VW + i + 1, (j + 1) * VW + i + 1, 0, 1]);
        if (!inR(i, j + 1)) edges.push([(j + 1) * VW + i + 1, (j + 1) * VW + i, -1, 0]);
        if (!inR(i - 1, j)) edges.push([(j + 1) * VW + i, j * VW + i, 0, -1]);
      }
    const byStart = new Map();
    edges.forEach((e, k) => {
      const l = byStart.get(e[0]);
      if (l) l.push(k);
      else byStart.set(e[0], [k]);
    });
    const used = new Uint8Array(edges.length);
    const loops = [];
    for (let k0 = 0; k0 < edges.length; k0++) {
      if (used[k0]) continue;
      const loop = [];
      let k = k0;
      let guard = 0;
      while (k != null && !used[k] && guard++ < 1e6) {
        used[k] = 1;
        const e = edges[k];
        loop.push(e);
        const cands = (byStart.get(e[1]) || []).filter((c) => !used[c]);
        if (!cands.length) break;
        if (cands.length === 1) k = cands[0];
        else {
          // pinch vertex: prefer a right turn (keeps the region on the right)
          const rx = -e[3], ry = e[2];
          k = cands.find((c) => edges[c][2] === rx && edges[c][3] === ry);
          if (k == null) k = cands.find((c) => edges[c][2] === e[2] && edges[c][3] === e[3]);
          if (k == null) k = cands[0];
        }
      }
      // simplify: keep vertices where direction changes
      const pts = [];
      for (let q = 0; q < loop.length; q++) {
        const prev = loop[(q - 1 + loop.length) % loop.length];
        const cur = loop[q];
        if (prev[2] !== cur[2] || prev[3] !== cur[3]) pts.push(cur[0]);
      }
      if (pts.length >= 3) loops.push(pts.map((v) => ({ i: v % VW, j: Math.floor(v / VW) })));
    }
    return loops;
  }

  function computeRooms(doc, floorId) {
    const key = floorId;
    const c = roomCache.get(key);
    const coarse = inGesture();
    if (c && c.walls === doc.walls && c.seeds === doc.roomSeeds && c.seps === doc.separators && (!c.coarse || coarse))
      return c.rooms;
    const CELL = coarse ? CELL_PREVIEW : DD.rooms.CELL;
    const R = rasterizeFloor(doc, floorId, CELL);
    const rooms = [];
    if (R) {
      const { x0, y0, W, H, blocked, barR, barD, seeds } = R;
      const label = scratch('label', Int32Array, W * H, -1);
      const regions = [];
      const stack = scratch('stack', Int32Array, W * H, 0);
      seeds.forEach((seed) => {
        let si = Math.floor((seed.x - x0) / CELL), sj = Math.floor((seed.y - y0) / CELL);
        // seed inside a wall? search nearby for a free cell
        if (si < 0 || sj < 0 || si >= W || sj >= H || blocked[sj * W + si]) {
          let found = false;
          for (let r = 1; r < 40 && !found; r++)
            for (let dj = -r; dj <= r && !found; dj++)
              for (let di = -r; di <= r && !found; di++) {
                const i = si + di, j = sj + dj;
                if (i >= 0 && j >= 0 && i < W && j < H && !blocked[j * W + i]) {
                  si = i;
                  sj = j;
                  found = true;
                }
              }
          if (!found) return;
        }
        const idx0 = sj * W + si;
        if (label[idx0] >= 0) {
          regions[label[idx0]].seeds.push(seed);
          return;
        }
        const rid = regions.length;
        const reg = { rid, seeds: [seed], cells: 0, open: false, bx0: si, by0: sj, bx1: si, by1: sj };
        regions.push(reg);
        let sp = 0;
        stack[sp++] = idx0;
        label[idx0] = rid;
        while (sp) {
          const idx = stack[--sp];
          const i = idx % W, j = (idx - i) / W;
          reg.cells++;
          if (i < reg.bx0) reg.bx0 = i;
          if (i > reg.bx1) reg.bx1 = i;
          if (j < reg.by0) reg.by0 = j;
          if (j > reg.by1) reg.by1 = j;
          if (i === 0 || j === 0 || i === W - 1 || j === H - 1) {
            reg.open = true;
          }
          // right
          if (i < W - 1 && !barR[idx]) {
            const n = idx + 1;
            if (!blocked[n] && label[n] < 0) {
              label[n] = rid;
              stack[sp++] = n;
            }
          }
          if (i > 0 && !barR[idx - 1]) {
            const n = idx - 1;
            if (!blocked[n] && label[n] < 0) {
              label[n] = rid;
              stack[sp++] = n;
            }
          }
          if (j < H - 1 && !barD[idx]) {
            const n = idx + W;
            if (!blocked[n] && label[n] < 0) {
              label[n] = rid;
              stack[sp++] = n;
            }
          }
          if (j > 0 && !barD[idx - W]) {
            const n = idx - W;
            if (!blocked[n] && label[n] < 0) {
              label[n] = rid;
              stack[sp++] = n;
            }
          }
        }
      });
      regions.forEach((reg) => {
        const primary = reg.seeds[0];
        const names = [];
        reg.seeds.forEach((s) => {
          if (names.indexOf(s.name) < 0) names.push(s.name);
        });
        const room = {
          id: 'room:' + primary.id,
          floor: floorId,
          seedIds: reg.seeds.map((s) => s.id),
          name: names.join(' + '),
          material: primary.material,
          outdoor: reg.seeds.every((s) => s.outdoor),
          planArea: reg.seeds.length === 1 ? primary.planArea : null,
          open: reg.open,
          cells: reg.cells,
          area: reg.open ? 0 : (reg.cells * CELL * CELL) / 1e6,
          labelX: primary.x,
          labelY: primary.y,
          outer: null,
          holes: [],
          bbox: {
            minX: x0 + reg.bx0 * CELL,
            minY: y0 + reg.by0 * CELL,
            maxX: x0 + (reg.bx1 + 1) * CELL,
            maxY: y0 + (reg.by1 + 1) * CELL,
          },
          perimeter: 0,
        };
        if (!reg.open) {
          const loops = traceRegion(label, W, H, reg.rid, reg.bx0, reg.by0, reg.bx1, reg.by1).map((l) =>
            l.map((v) => ({ x: x0 + v.i * CELL, y: y0 + v.j * CELL }))
          );
          loops.sort((a, b) => Math.abs(U.polygonArea(b)) - Math.abs(U.polygonArea(a)));
          room.outer = loops[0] || null;
          room.holes = loops.slice(1);
          if (room.outer)
            room.perimeter = room.outer.reduce((acc, p, i2) => acc + U.dist(p, room.outer[(i2 + 1) % room.outer.length]), 0);
        }
        rooms.push(room);
      });
    }
    roomCache.set(key, { walls: doc.walls, seeds: doc.roomSeeds, seps: doc.separators, rooms, coarse });
    return rooms;
  }

  DD.rooms = {
    CELL,
    /** Rooms of a floor: [{id, floor, seedIds, name, material, outdoor, planArea, open, area (m²), perimeter (mm),
     *  labelX, labelY, outer:[{x,y}], holes:[[{x,y}]], bbox}]. Cached per (walls, roomSeeds, separators) identity. */
    compute: computeRooms,
    /** Room containing a world point (uses polygon test on the computed rooms). */
    at(doc, floorId, x, y) {
      const rooms = computeRooms(doc, floorId);
      return (
        rooms.find(
          (r) => r.outer && U.pointInPolygon({ x, y }, r.outer) && !r.holes.some((h) => U.pointInPolygon({ x, y }, h))
        ) || null
      );
    },
    byId(doc, floorId, roomId) {
      return computeRooms(doc, floorId).find((r) => r.id === roomId) || null;
    },
    /** Total built (indoor) area of a floor, m². */
    totalArea(doc, floorId) {
      return computeRooms(doc, floorId)
        .filter((r) => !r.open && !r.outdoor)
        .reduce((a, r) => a + r.area, 0);
    },
  };

  // ------------------------------------------------------------------ persistence
  const LS_KEY = 'dd.decor.casa.v1';
  DD.persist = {
    key: LS_KEY,
    save(doc) {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify({ savedAt: new Date().toISOString(), doc }));
        return true;
      } catch (e) {
        console.warn('save failed', e);
        return false;
      }
    },
    load() {
      try {
        const raw = localStorage.getItem(LS_KEY);
        if (!raw) return null;
        const parsed = JSON.parse(raw);
        const doc = DD.persist.validate(parsed && parsed.doc);
        return doc ? { doc, savedAt: parsed.savedAt } : null;
      } catch (e) {
        console.warn('load failed', e);
        return null;
      }
    },
    clear() {
      try {
        localStorage.removeItem(LS_KEY);
      } catch (e) {
        /* storage unavailable */
      }
    },
    /**
     * Schema validation for loaded/imported documents. Returns a NEW, normalised doc or null.
     * Structural problems (no floors, duplicate floor ids, too many broken items) reject the file; items with
     * a bad optional field get defaults; items with bad required fields are dropped (count in lastDropped).
     */
    lastDropped: 0,
    validate(input) {
      DD.persist.lastDropped = 0;
      if (!input || typeof input !== 'object' || Array.isArray(input)) return null;
      const arrays = ['floors', 'walls', 'openings', 'roomSeeds', 'stairs', 'furniture'];
      for (const k of arrays) if (!Array.isArray(input[k])) return null;
      const num = (v) => typeof v === 'number' && isFinite(v);
      const str = (v, max) => (typeof v === 'string' && v.length > 0 && v.length <= (max || 80) ? v : null);
      const pt = (p) => (p && num(p.x) && num(p.y) && Math.abs(p.x) < 1e6 && Math.abs(p.y) < 1e6 ? { x: p.x, y: p.y } : null);
      const floors = [];
      const floorIds = new Set();
      for (const f of input.floors) {
        if (!f || !str(f.id, 40) || floorIds.has(f.id) || !num(f.level) || !num(f.height) || f.height <= 0) return null;
        floorIds.add(f.id);
        floors.push({
          id: f.id, name: str(f.name, 60) || f.id, short: str(f.short, 4) || '', level: f.level, height: f.height,
          ceiling: num(f.ceiling) && f.ceiling > 0 ? f.ceiling : f.height - 100,
        });
      }
      if (!floors.length) return null;
      let dropped = 0, total = 0;
      const keep = (list, fn) =>
        list.map((it) => {
          total++;
          const r = it && typeof it === 'object' ? fn(it) : null;
          if (!r) dropped++;
          return r;
        }).filter(Boolean);
      const KINDS = ['structural', 'partition', 'muro', 'railing'];
      const walls = keep(input.walls, (w) => {
        const a = pt(w.a), b = pt(w.b);
        if (!str(w.id, 80) || !floorIds.has(w.floor) || !a || !b || !num(w.thick) || w.thick <= 0 || w.thick > 2000) return null;
        const kind = KINDS.indexOf(w.kind) >= 0 ? w.kind : 'partition';
        const out = { id: w.id, floor: w.floor, a, b, thick: w.thick, kind, height: num(w.height) && w.height > 0 ? w.height : DD.data.KIND_HEIGHT[kind] };
        if (num(w.mureta) && w.mureta >= 0) out.mureta = w.mureta;
        return out;
      });
      const wallIds = new Set(walls.map((w) => w.id));
      const openings = keep(input.openings, (o) => {
        if (!str(o.id, 80) || !wallIds.has(o.wall) || !num(o.t) || !num(o.width) || o.width <= 0 || !num(o.height) || o.height <= 0) return null;
        if (o.type !== 'door' && o.type !== 'window') return null;
        return {
          id: o.id, wall: o.wall, code: str(o.code, 12) || (o.type === 'door' ? 'P' : 'J'), type: o.type, t: o.t,
          width: o.width, height: o.height, sill: num(o.sill) && o.sill >= 0 ? o.sill : 0,
          style: str(o.style, 20) || (o.type === 'door' ? 'swing' : 'slide2'),
          hinge: o.hinge === 'end' ? 'end' : 'start', side: o.side === -1 ? -1 : 1,
        };
      });
      const roomSeeds = keep(input.roomSeeds, (r) => {
        if (!str(r.id, 80) || !floorIds.has(r.floor) || !num(r.x) || !num(r.y)) return null;
        return {
          id: r.id, floor: r.floor, name: str(String(r.name == null ? '' : r.name).slice(0, 60), 60) || 'Ambiente',
          x: r.x, y: r.y, material: str(r.material, 40) || 'porcelanato',
          planArea: num(r.planArea) ? r.planArea : null, outdoor: r.outdoor === true,
        };
      });
      const int = (v, lo, hi) => (num(v) && Math.round(v) === v && v >= lo && v <= hi ? v : null);
      const stairs = keep(input.stairs, (st) => {
        if (!str(st.id, 80) || !floorIds.has(st.floor) || !num(st.x) || !num(st.y)) return null;
        if (!(num(st.length) && st.length > 0 && num(st.width) && st.width > 0 && num(st.tread) && st.tread > 50)) return null;
        const lower = int(st.lowerCount, 1, 30), upper = int(st.upperCount, 1, 30);
        if (lower == null || upper == null) return null;
        return { id: st.id, floor: st.floor, x: st.x, y: st.y, length: st.length, width: st.width, tread: st.tread, lowerCount: lower, upperCount: upper };
      });
      const HEX = /^#[0-9a-fA-F]{6}$/;
      const furniture = keep(input.furniture, (f) => {
        if (!str(f.id, 80) || !floorIds.has(f.floor) || !str(f.type, 40) || !num(f.x) || !num(f.y)) return null;
        if (!(num(f.w) && f.w > 0 && f.w <= 20000 && num(f.d) && f.d > 0 && f.d <= 20000)) return null;
        const def = DD.catalog && DD.catalog.types ? DD.catalog.types[f.type] : null;
        return {
          id: f.id, floor: f.floor, type: f.type, x: f.x, y: f.y, rot: num(f.rot) ? U.normDeg(f.rot) : 0, w: f.w, d: f.d,
          h: num(f.h) && f.h > 0 ? f.h : def ? def.h : 800, elev: num(f.elev) ? f.elev : 0,
          color: typeof f.color === 'string' && HEX.test(f.color) ? f.color : null,
        };
      });
      const segs = (list) =>
        keep(Array.isArray(list) ? list : [], (m) => {
          const a = pt(m.a), b = pt(m.b);
          return str(m.id, 80) && floorIds.has(m.floor) && a && b ? { id: m.id, floor: m.floor, a, b } : null;
        });
      const separators = segs(input.separators);
      const measures = segs(input.measures);
      if (total && dropped / total > 0.2) return null;
      DD.persist.lastDropped = dropped;
      const defaults = DD.data.initialState();
      const ZONES = ['grass', 'paving', 'driveway'];
      const inSite = input.site && input.site.lot && num(input.site.lot.w) && num(input.site.lot.h) ? input.site : null;
      const site = inSite
        ? {
            lot: { w: inSite.lot.w, h: inSite.lot.h },
            street: str(inSite.street, 60) || defaults.site.street,
            northDeg: num(inSite.northDeg) ? inSite.northDeg : defaults.site.northDeg,
            zones: (Array.isArray(inSite.zones) ? inSite.zones : [])
              .filter((z) => z && ZONES.indexOf(z.kind) >= 0 && num(z.x) && num(z.y) && num(z.w) && num(z.h) && z.w > 0 && z.h > 0)
              .map((z) => ({ id: str(z.id, 80) || U.uid('z'), kind: z.kind, x: z.x, y: z.y, w: z.w, h: z.h })),
          }
        : defaults.site;
      const meta = { name: (input.meta && str(input.meta.name, 80)) || defaults.meta.name, source: (input.meta && str(input.meta.source, 120)) || defaults.meta.source };
      return { version: 1, meta, floors, walls, openings, roomSeeds, separators, stairs, furniture, measures, site };
    },
    downloadJSON(doc, filename) {
      const blob = new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' });
      DD.persist.downloadBlob(blob, filename || 'projeto-decoracao.json');
    },
    downloadDataURL(dataURL, filename) {
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
    },
    downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      DD.persist.downloadDataURL(url, filename);
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    },
    readJSONFile(file) {
      return new Promise((resolve, reject) => {
        const r = new FileReader();
        r.onload = () => {
          try {
            const doc = DD.persist.validate(JSON.parse(r.result));
            if (!doc) reject(new Error('Arquivo não é um projeto válido.'));
            else resolve(doc);
          } catch (e) {
            reject(new Error('JSON inválido.'));
          }
        };
        r.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
        r.readAsText(file);
      });
    },
  };
})();

// ---- 10-materials.js ----
// ===== 10-materials.js — procedural floor materials (DD.materials) =====
// Every texture is a 512×512 canvas generated from pure pixel math (seeded PRNG, periodic lattice noise,
// wrapped stamps, tile/plank grids whose period divides the canvas), so it is deterministic and tiles
// seamlessly both as a 2D canvas pattern and as a three.js RepeatWrapping texture.
// One canvas covers `tileMM × tileMM` millimetres of floor.
(function () {
  'use strict';
  const DD = (window.DD = window.DD || {});

  const SIZE = 512; // must stay a power of two (coordinates wrap with `& MASK`)
  const MASK = SIZE - 1;
  const TAU = Math.PI * 2;

  // ================================================================== math primitives (pure, tested in Node)
  /** Seeded PRNG → function returning floats in [0,1). */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function next() {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  /** FNV-1a string hash → uint32 (stable material seeds). */
  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  /** Stateless integer hash of (x, y, seed) → [0,1). */
  function hash2(x, y, seed) {
    let h = (seed | 0) ^ Math.imul(x | 0, 0x27d4eb2d);
    h = Math.imul(h ^ (h >>> 15), 0x85ebca6b);
    h ^= Math.imul(y | 0, 0x165667b1);
    h = Math.imul(h ^ (h >>> 13), 0xc2b2ae35);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
  const fade = (t) => t * t * (3 - 2 * t);
  function smoothstep(e0, e1, x) {
    const t = clamp01((x - e0) / (e1 - e0));
    return t * t * (3 - 2 * t);
  }
  function modPos(a, n) {
    const r = a % n;
    return r < 0 ? r + n : r;
  }

  // ------------------------------------------------------------------ periodic value noise
  /** Random lattice of px × py values; sampling wraps, so noise built on it has period (px, py) lattice units. */
  function makeLattice(px, py, seed) {
    const v = new Float32Array(px * py);
    for (let j = 0; j < py; j++) for (let i = 0; i < px; i++) v[j * px + i] = hash2(i, j, seed);
    return { px, py, v };
  }
  /** Smooth value noise at lattice coordinates (gx, gy); exactly periodic in (L.px, L.py). */
  function sampleLattice(L, gx, gy) {
    const fx = Math.floor(gx), fy = Math.floor(gy);

    const i0 = modPos(fx, L.px), j0 = modPos(fy, L.py);
    const i1 = i0 + 1 === L.px ? 0 : i0 + 1, j1 = j0 + 1 === L.py ? 0 : j0 + 1;
    const r0 = j0 * L.px, r1 = j1 * L.px;
    const top = L.v[r0 + i0] + (L.v[r0 + i1] - L.v[r0 + i0]) * tx;

  /**
   * Fractal (fBm) noise whose every octave has an integer number of lattice cells across the canvas, so it is

  // ------------------------------------------------------------------ plank rows (wood, vinyl, deck)
  function circularGap(a, b) {

  }
  /** Default joint picker: 1 or 2 end joints per row (every row needs ≥ 1 so plank-local coords wrap cleanly). */
  function randomJoints(cfg, rng) {
    const first = rng() * SIZE;

    return [first, modPos(first + SIZE * (0.36 + rng() * 0.28), SIZE)];

  /** Build a row: sorted joints, per-pixel segment lookup and segment lengths. */
  function makeRow(joints) {

    const n = starts.length;
    const seg = new Uint8Array(SIZE);
    for (let x = 0; x < SIZE; x++) {
      let s = n - 1; // before the first joint = tail of the last plank (it wraps around the edge)
      for (let i = 0; i < n; i++) if (starts[i] <= x + 0.5) s = i;
      seg[x] = s;
    }
    const lens = starts.map((s, i) => (i + 1 < n ? starts[i + 1] : starts[0] + SIZE) - s);
    return { starts, lens, seg };

  function layoutRows(cfg, rng) {

      const prev = r > 0 ? rows[r - 1].starts : null;
      const first = r === cfg.rows - 1 && r > 0 ? rows[0].starts : null;
      let joints = null;
      for (let attempt = 0; attempt < 80 && !joints; attempt++) {
        const cand = (cfg.pickJoints || randomJoints)(cfg, rng, r);

      }

  // ------------------------------------------------------------------ wood figure
  /** Random growth-ring geometry of one plank (flat-sawn "cathedral" or straight rift grain, optional knot). */
  function makePlank(P, rng, len, rowH) {
    const cathedral = rng() < P.cathedral;
    const [f0, f1] = P.freq;

      id: (rng() * 1e9) | 0,
      tone: (rng() - 0.5) * 2 * P.toneVar,
      tint: (rng() - 0.5) * 2 * P.tintVar,

      depth: cathedral ? 4 + rng() * 22 : rng() * 6,
      taper: cathedral ? (rng() < 0.5 ? -1 : 1) * (0.03 + rng() * 0.06) : (rng() - 0.5) * 0.01,

      oy: (rng() * SIZE) | 0,

  // ================================================================== material generators

  /** Porcelanato 60×60, retificado, cinza claro quente — 2×2 tiles (1,20 m). */
  function genPorcelanato(img, seed) {

  /** Mármore Calacatta 80×80 — soft branching grey/gold veins, each tile cut from a different part of the slab. */
  function genMarmore(img, seed) {
    const { vein, halo } = marbleVeins(seed);

    const base = [241, 238, 233], gold = [201, 180, 142], grey = [112, 108, 104];

  /** Periodic vein fields: zero crossings of warped sines with integer frequencies (so they wrap). */
  function marbleVeins(seed) {

    const W2 = fbmField({ px: 3, octaves: 3, gain: 0.5, seed: seed + 2 });

    const vein = new Float32Array(SIZE * SIZE), halo = new Float32Array(SIZE * SIZE);
    for (let y = 0; y < SIZE; y++) {
      const v = (y + 0.5) / SIZE;
      for (let x = 0; x < SIZE; x++) {
        const k = y * SIZE + x, u = (x + 0.5) / SIZE, w1 = W1[k], w2 = W2[k], m = M[k];
        // main veins: broad soft body + darker core, fading in and out along their length
        const s1 = Math.abs(Math.sin(TAU * (u + 2 * v + 1.7 * w1 + 0.25 * w2)));
        const main = smoothstep(0.34, 0.58, m);
        // secondary veins branch off where the warp field is high; hairlines everywhere, faint
        const s2 = Math.abs(Math.sin(TAU * (3 * u - v + 1.4 * w2 + 0.8 * w1)));
        const branch = smoothstep(0.5, 0.64, w1 + (m - 0.5) * 0.6);
        const s3 = Math.abs(Math.sin(TAU * (2 * u + 5 * v + 1.2 * w1 + 0.4 * w2)));
        const body = veinLine(s1, 0.16) * 0.42 + veinLine(s1, 0.045) * 0.58;
        vein[k] = Math.max(body * main, veinLine(s2, 0.035) * 0.45 * branch, veinLine(s3, 0.022) * 0.12);
        halo[k] = veinLine(s1, 0.34) * main + veinLine(s2, 0.12) * 0.3 * branch;
      }
    }
    return { vein, halo };
  }
  /** Soft line profile from |sin| (≈ distance to the vein centre in phase units). */
  function veinLine(s, w) {
    return s >= w ? 0 : fade(1 - s / w);
  }

  /** Cerâmica 45×45 branco-bege (banheiros) — 4×4 tiles (1,80 m), cushioned edges. */
  function genCeramica(img, seed) {
    const cloud = fbmField({ px: 4, octaves: 5, gain: 0.5, seed });
    const base = [234, 229, 220];
    renderTiles(img, {
      nx: 4, ny: 4, seed,
      edge: { half: 0.55, bevel: 2.2, depth: 0.12, joint: [192, 186, 176], grain: 0.12 },
      surface(x, y, t) {
        setC(base, 1 + t.tone * 0.03 + (at(cloud, x + t.ox, y + t.oy) - 0.5) * 0.07 + (hash2(x, y, seed + 9) - 0.5) * 0.02);
        tintC(t.tint * 0.025);
      },
    });
  }

  /** Cerâmica antiderrapante 45×45 — sandy terracotta, gritty surface, wider grout — 4×4 tiles (1,80 m). */
  function genCeramicaExt(img, seed) {
    const cloud = fbmField({ px: 4, octaves: 5, gain: 0.55, seed });
    const base = [192, 146, 110];
    renderTiles(img, {
      nx: 4, ny: 4, seed,
      edge: { half: 0.85, bevel: 2.6, depth: 0.2, joint: [126, 114, 102], grain: 0.2 },
      surface(x, y, t) {
        const grit = hash2(x, y, seed + 5);
        let f = 1 + t.tone * 0.1 + (at(cloud, x + t.ox, y + t.oy) - 0.5) * 0.16 + (grit - 0.5) * 0.14;
        if (grit > 0.985) f -= 0.18; // dark grains
        else if (grit < 0.012) f += 0.12; // quartz-like light grains

      },
    });

  /** Ladrilho hidráulico 20×20 — cement tile with a rosette formed across 4 tiles — 4×4 tiles (0,80 m). */
  function genLadrilho(img, seed) {
    const mottle = fbmField({ px: 8, octaves: 4, gain: 0.55, seed });
    const wear = fbmField({ px: 3, octaves: 4, gain: 0.5, seed: seed + 1 });
    const cream = [228, 216, 192], terra = [168, 96, 72], teal = [58, 112, 110], worn = [204, 196, 182];
    renderTiles(img, {
      nx: 4, ny: 4, seed,
      edge: { half: 0.5, bevel: 1.4, depth: 0.08, joint: [170, 163, 150], grain: 0.15 },
      surface(x, y, t, lx, ly, tw) {
        hydraulicMotif((lx / tw) * 2 - 1, (ly / tw) * 2 - 1, tw / 2, cream, terra, teal);
        const k = y * SIZE + x;
        scaleC(1 + (mottle[k] - 0.5) * 0.14 + (hash2(x, y, seed + 7) - 0.5) * 0.06 + t.tone * 0.04);
        mixC(worn, smoothstep(0.62, 0.76, wear[k]) * 0.2);
      },
    });
  }
  /** Motif in tile coords u,v ∈ [-1,1]; `ppu` = pixels per unit for antialiasing. Writes C. */
  function hydraulicMotif(u, v, ppu, cream, terra, teal) {
    const au = Math.abs(u), av = Math.abs(v);
    setC(cream, 1);
    // lozenges centred on the edge midpoints (completed by the neighbouring tile)
    const loz = Math.min(au + (1 - av) * 1.6 - 0.28, av + (1 - au) * 1.6 - 0.28) / 1.887;
    mixC(teal, coverage(loz, ppu));
    // quarter circles in the corners → full rosettes where 4 tiles meet
    const cu = 1 - au, cv = 1 - av, dc = Math.sqrt(cu * cu + cv * cv);
    mixC(teal, coverage(dc - 0.62, ppu));
    mixC(cream, coverage(dc - 0.53, ppu));
    mixC(terra, coverage(dc - 0.44, ppu));
    mixC(cream, coverage(dc - 0.21, ppu));
    mixC(teal, coverage(dc - 0.12, ppu));
    // 8-point star (square ∪ diamond) in the centre
    const sq = Math.max(au, av), di = (au + av) / Math.SQRT2, dm = Math.sqrt(u * u + v * v);
    mixC(terra, coverage(Math.min(sq, di) - 0.4, ppu));
    mixC(cream, coverage(Math.min(sq, di) - 0.31, ppu));
    mixC(teal, coverage(dm - 0.16, ppu));
    mixC(cream, coverage(dm - 0.065, ppu));
  }
  /** Antialiased coverage of a signed distance (units) at `ppu` pixels per unit. */
  function coverage(sd, ppu) {
    return clamp01(0.5 - sd * ppu);
  }

  /** Cimento queimado — continuous burnished cement, cloudy mottling, trowel arcs, pinholes (2,40 m). */
  function genCimento(img, seed) {
    const cloud = fbmField({ px: 2, octaves: 6, gain: 0.55, seed });
    const mott = fbmField({ px: 8, octaves: 4, gain: 0.5, seed: seed + 1 });
    const trowel = trowelField(seed + 2, { count: 110, radius: [70, 220], width: [18, 42], amp: 0.024 });
    const base = [170, 167, 160];
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++) {
        const k = y * SIZE + x, c = cloud[k];
        let f = 1 + (c - 0.5) * 0.3 + (mott[k] - 0.5) * 0.12 + trowel[k] - smoothstep(0.56, 0.72, c) * 0.06;
        const pin = hash2(x, y, seed + 3);
        if (pin > 0.9965) f -= 0.22;
        f += (pin - 0.5) * 0.02;
        setC(base, f);
        tintC((mott[k] - 0.5) * 0.04);
        storeC(img, x, y);
      }
  }
  /**
   * Sum of trowel arcs (burnished band with a slightly darker outer lip), stamped with wrap-around.
   * o = { count, radius:[min,max], width:[min,max], amp } (px / brightness fraction).
   */
  function trowelField(seed, o) {
    const field = new Float32Array(SIZE * SIZE);
    const rng = mulberry32(seed);
    const pick = (r) => r[0] + rng() * (r[1] - r[0]);
    for (let i = 0; i < o.count; i++) {
      stampArc(field, {
        cx: rng() * SIZE, cy: rng() * SIZE, R: pick(o.radius),
        a0: rng() * TAU, sweep: 0.5 + rng() * 0.8,
        w: pick(o.width), amp: o.amp * (0.4 + rng() * 0.6) * (rng() < 0.35 ? -1 : 1),
      });
    }
    return field;
  }
  function stampArc(field, a) {
    const mid = a.a0 + a.sweep / 2, mx = Math.cos(mid), my = Math.sin(mid), cosHalf = Math.cos(a.sweep / 2);
    let bx0 = Infinity, by0 = Infinity, bx1 = -Infinity, by1 = -Infinity;
    for (let i = 0; i <= 12; i++) {
      const ang = a.a0 + (a.sweep * i) / 12, px = a.cx + Math.cos(ang) * a.R, py = a.cy + Math.sin(ang) * a.R;
      bx0 = Math.min(bx0, px); by0 = Math.min(by0, py); bx1 = Math.max(bx1, px); by1 = Math.max(by1, py);
    }
    const hw = a.w / 2;
    for (let y = Math.floor(by0 - hw); y <= Math.ceil(by1 + hw); y++)
      for (let x = Math.floor(bx0 - hw); x <= Math.ceil(bx1 + hw); x++) {
        const dx = x + 0.5 - a.cx, dy = y + 0.5 - a.cy, d = Math.sqrt(dx * dx + dy * dy);
        const across = (d - a.R) / hw;
        if (across <= -1 || across >= 1 || d < 1e-6) continue;
        const cosA = (dx * mx + dy * my) / d;
        if (cosA <= cosHalf) continue;
        const taper = smoothstep(0, 0.45, (cosA - cosHalf) / (1 - cosHalf));
        const profile = (1 - across * across) * (1 - across * across) - 0.35 * smoothstep(0.6, 0.95, across);
        field[(y & MASK) * SIZE + (x & MASK)] += a.amp * taper * profile;
      }
  }

  /** Concreto desempenado (garagem) — speckled aggregate, stains, saw-cut joints every 1,50 m (3,00 m). */
  function genConcreto(img, seed) {
    const cloud = fbmField({ px: 2, octaves: 6, gain: 0.55, seed });
    const stain = fbmField({ px: 4, octaves: 4, gain: 0.55, seed: seed + 1 });
    const swirl = trowelField(seed + 2, { count: 50, radius: [90, 220], width: [14, 30], amp: 0.018 });
    const base = [154, 152, 147];
    renderTiles(img, {
      nx: 2, ny: 2, seed,
      edge: { half: 0.75, bevel: 0.9, depth: 0.14, joint: [70, 68, 65], grain: 0.35 },
      surface(x, y) {
        const k = y * SIZE + x, h = hash2(x, y, seed + 4), stone = hash2(x >> 1, y >> 1, seed + 5);
        let f = 1 + (cloud[k] - 0.5) * 0.18 + (h - 0.5) * 0.08 + swirl[k] - smoothstep(0.58, 0.8, stain[k]) * 0.045;
        if (stone > 0.993) f += 0.08;
        else if (stone < 0.005) f -= 0.1;
        setC(base, f);
        tintC((stain[k] - 0.5) * 0.03);
      },
    });
  }

  /** Carpete buclê — fine fibre noise, loop rows, heather flecks (0,80 m). */
  function genCarpete(img, seed) {
    const cloud = fbmField({ px: 4, octaves: 4, gain: 0.5, seed });
    const base = [150, 140, 128];
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++) {
        const h = hash2(x, y, seed + 1), loops = Math.sin((TAU * x) / 4) * Math.sin((TAU * (y + (x >> 2 & 1) * 2)) / 4);
        let f = 1 + (h - 0.5) * 0.2 + (cloud[y * SIZE + x] - 0.5) * 0.1 + loops * 0.035;
        if (h > 0.975) f += 0.12; // heather fleck
        setC(base, f);
        storeC(img, x, y);
      }
  }

  /** Deck de madeira — boards 14 cm + 5 mm gaps, ends on joists, stainless screws, weathering (1,16 m). */
  function genDeck(img, seed) {
    const weather = fbmField({ px: 1, py: 8, octaves: 4, gain: 0.55, seed: seed + 91 });
    const silver = [128, 118, 106];
    genPlanks(img, seed, WOOD_DECK, (x, y, pk, lx, ly, len, rowH, row) => {
      mixC(silver, smoothstep(0.55, 0.75, weather[y * SIZE + x]) * 0.25);
      // joist centres sit mid-cell, never within 10 px of the canvas edge → no wrap needed here
      const j = Math.floor(((x + 0.5) * DECK_JOISTS) / SIZE);
      const dx = x + 0.5 - DECK_JOIST_X[j];
      if (dx < -10 || dx > 10) return;
      const sx = row.joistEnds[j] ? (dx < 0 ? -5 : 5) : 0; // board ends get their screws either side of the joint
      drawScrew(dx - sx, ly - rowH * 0.28);
      drawScrew(dx - sx, ly - rowH * 0.7);
    });
  }
  function drawScrew(dx, dy) {
    const d = Math.sqrt(dx * dx + dy * dy);
    if (d > 2.8) return;
    scaleC(1 - 0.28 * smoothstep(2.8, 1.8, d)); // countersink
    if (d < 1.7) {
      const lit = 1 + (-dx - dy) * 0.12;
      C[0] = 96 * lit;
      C[1] = 92 * lit;
      C[2] = 88 * lit;
    }
  }

  /** Grama esmeralda — patchy base, thousands of wrapped blade strokes (1,20 m). */
  function genGrama(img, seed) {
    const patch = fbmField({ px: 2, octaves: 5, gain: 0.55, seed });
    const soil = [48, 72, 32], lush = [76, 118, 46];
    for (let k = 0, p = 0; p < SIZE * SIZE; p++, k += 3) {
      const t = patch[p];
      img[k] = soil[0] + (lush[0] - soil[0]) * t;
      img[k + 1] = soil[1] + (lush[1] - soil[1]) * t;
      img[k + 2] = soil[2] + (lush[2] - soil[2]) * t;
    }
    const rng = mulberry32(seed + 1);
    for (let i = 0; i < 16000; i++) drawBlade(img, rng, patch);
  }
  const BLADE_DARK = [66, 108, 40], BLADE_LIGHT = [118, 160, 64], BLADE_DRY = [156, 152, 88];
  function drawBlade(img, rng, patch) {
    const x0 = rng() * SIZE, y0 = rng() * SIZE, ang = rng() * TAU, len = 5 + rng() * 9, bend = (rng() - 0.5) * 0.08;
    const p = at(patch, x0 | 0, y0 | 0), shade = rng();
    const dry = rng() < smoothstep(0.55, 0.75, p) * 0.35;
    const col = [0, 0, 0];
    const steps = Math.ceil(len * 2);
    let a = ang, x = x0, y = y0;
    for (let s = 0; s <= steps; s++) {
      const tip = s / steps, light = clamp01(shade * 0.7 + tip * 0.45 + (p - 0.5));
      const src = dry ? BLADE_DRY : BLADE_DARK;
      for (let c = 0; c < 3; c++) col[c] = src[c] + (BLADE_LIGHT[c] - src[c]) * (dry ? tip * 0.3 : light);
      splat(img, x, y, col, 0.85 * (1 - tip * 0.5));
      a += bend;
      x += Math.cos(a) * 0.5;
      y += Math.sin(a) * 0.5;
    }
  }

  /** Calçada — placas de concreto 40×40, washed fine aggregate — 4×4 plates (1,60 m). */
  function genCalcada(img, seed) {
    const cloud = fbmField({ px: 4, octaves: 5, gain: 0.55, seed });
    const base = [184, 178, 167];
    renderTiles(img, {
      nx: 4, ny: 4, seed,
      edge: { half: 1.1, bevel: 2.2, depth: 0.2, joint: [104, 98, 90], grain: 0.3 },
      surface(x, y, t) {
        const h = hash2(x, y, seed + 2), stone = hash2(x >> 1, y >> 1, seed + 3);
        let f = 1 + t.tone * 0.06 + (at(cloud, x + t.ox, y + t.oy) - 0.5) * 0.16 + (h - 0.5) * 0.12;
        if (stone > 0.975) f -= 0.1;
        setC(base, f);
        tintC(t.tint * 0.012);
      },
    });
  }

  // ------------------------------------------------------------------ interlocking pavers (herringbone)
  const HB_N = 4; // herringbone period in cells
  const DIR = { R: 0, L: 1, D: 2, U: 3 };
  /**
   * 90° herringbone of 1×2 bricks: brick pair {H at (0,0)-(1,0), V at (0,1)-(0,2)} repeated by the lattice
   * m·(1,1) + n·(2,−2), which contains (4,0) and (0,4) → a 4×4-cell periodic map of partner directions.
   */
  function buildHerringbone() {
    const partner = new Int8Array(HB_N * HB_N).fill(-1);
    const seen = new Set();
    const place = (cells, dirs) => {
      const wrapped = cells.map(([cx, cy]) => [modPos(cx, HB_N), modPos(cy, HB_N)]);
      const key = wrapped.map((c) => c.join(',')).join('|') + dirs.join('');
      if (seen.has(key)) return;
      seen.add(key);
      wrapped.forEach(([cx, cy], i) => {
        const idx = cy * HB_N + cx;
        if (partner[idx] !== -1) throw new Error('herringbone overlap at ' + cx + ',' + cy);
        partner[idx] = dirs[i];
      });
    };
    for (let m = 0; m < HB_N; m++)
      for (let n = 0; n < HB_N; n++) {
        const ox = m + 2 * n, oy = m - 2 * n;
        place([[ox, oy], [ox + 1, oy]], [DIR.R, DIR.L]);
        place([[ox, oy + 1], [ox, oy + 2]], [DIR.D, DIR.U]);
      }
    return partner;
  }
  let herringbone = null;
  /** Piso intertravado — concrete pavers 10×20 in herringbone, chamfered edges, sand joints (3,20 m). */
  function genIntertravado(img, seed) {
    herringbone = herringbone || buildHerringbone();
    const cell = 16, cells = SIZE / cell; // 100 mm per cell
    const cloud = fbmField({ px: 4, octaves: 5, gain: 0.55, seed });
    const base = [150, 146, 140];
    const edge = edgeSpec({ half: 0.6, bevel: 2.4, depth: 0.3, joint: [178, 162, 130], grain: 0.35 }, seed);
    for (let y = 0; y < SIZE; y++)
      for (let x = 0; x < SIZE; x++) {
        const ci = x >> 4, cj = y >> 4, dir = herringbone[(cj % HB_N) * HB_N + (ci % HB_N)];
        const ax = (dir === DIR.L ? ci - 1 : ci) & (cells - 1), ay = (dir === DIR.U ? cj - 1 : cj) & (cells - 1);
        const tone = hash2(ax, ay, seed) - 0.5, ox = (hash2(ax, ay, seed + 1) * SIZE) | 0;
        const fx = (x & 15) + 0.5, fy = (y & 15) + 0.5, h = hash2(x, y, seed + 2);
        setC(base, 1 + tone * 0.09 + (at(cloud, x + ox, y + ox) - 0.5) * 0.14 + (h - 0.5) * 0.1);
        tintC(tone * 0.025);
        applyEdges(
          fx + (dir === DIR.L ? cell : 0), cell - fx + (dir === DIR.R ? cell : 0),
          fy + (dir === DIR.U ? cell : 0), cell - fy + (dir === DIR.D ? cell : 0), edge, x, y
        );
        storeC(img, x, y);
      }
  }

  const FALLBACK_ID = 'porcelanato';
  const BY_ID = new Map(DEFS.map((d) => [d.id, d]));

  function publicEntry(d) {
    const e = { id: d.id, name: d.name, group: d.group, tileMM: d.tileMM, base: d.base, desc: d.desc };
    if (d.site) e.site = true;

  const LIST = Object.freeze(DEFS.map(publicEntry));
  const LIST_BY_ID = new Map(LIST.map((e) => [e.id, e]));
  const resolveDef = (id) => BY_ID.get(id) || BY_ID.get(FALLBACK_ID);

  /** Pure generation (no DOM): RGBA bytes of the 512×512 texture. Deterministic per material id. */
  function generate(id) {
    const def = resolveDef(id);
    const img = newImage();
    def.gen(img, hashString('dd-material:' + def.id));
    return toRGBA(img);
  }

  // ================================================================== DOM layer (canvas, swatches)
  const canvasCache = new Map();
  const swatchCache = new Map();

  function createCanvas(size) {
    if (typeof document === 'undefined') throw new Error('DD.materials: canvas indisponível fora do navegador.');
    const c = document.createElement('canvas');
    c.width = size;
    c.height = size;
    return c;
  }
  function paintRGBA(c, rgba) {
    const ctx = c.getContext('2d');
    const data = ctx.createImageData(SIZE, SIZE);
    data.data.set(rgba);

    ctx.arcTo(bx, ay, bx, ay + rr, rr);
    ctx.lineTo(bx, by - rr);
    ctx.arcTo(bx, by, bx - rr, by, rr);

  }

  function paintUmbrella(g) {
    const rx = g.hw * 0.97, ry = g.hd * 0.97;
    g.alpha(0.3, () => g.ellipse(0, 0, rx, ry, g.F(g.c.mid)));
    g.ellipse(0, 0, rx, ry, g.S(INK, LW_DET, g.dash(5, 3)));
    for (let i = 0; i < 8; i++) {
      const a = (i * TAU) / 8;
      g.line(0, 0, Math.cos(a) * rx, Math.sin(a) * ry, g.S(INK, LW_DET * 0.8, g.dash(3, 3)));
    }
    g.circle(0, 0, Math.min(rx, ry) * 0.045, g.D(g.c.deep));
  }

  function paintCoffeeTable(g) {
    const { hw, hd, c } = g;
    tableTop(g, -hw, -hd, hw, hd);
    const r = Math.min(g.w, g.d) * 0.14;
    g.circle(hw * 0.45, 0, r, g.D(c.soft));
    g.box(-hw * 0.62, -hd * 0.42, -hw * 0.12, hd * 0.3, g.D(c.mid), 8);
  }

  function paintSideTable(g) {
    const { hw, hd, c } = g;
    if (Math.abs(hw - hd) / Math.max(hw, hd) < 0.12) {
      g.ellipse(0, 0, hw, hd, g.O(c.fill));
      g.ellipse(0, 0, hw * 0.82, hd * 0.82, g.D(null));
      g.circle(0, 0, Math.min(hw, hd) * 0.12, g.D(c.mid));
    } else {
      tableTop(g, -hw, -hd, hw, hd);
    }
  }

  function paintDesk(g) {
    const { hw, hd, w, d, c } = g;
    tableTop(g, -hw, -hd, hw, hd);
    if (w >= 700) {
      const mw = Math.min(600, w * 0.42);
      g.box(-mw / 2 - mw * 0.2, -hd + d * 0.28, mw / 2 - mw * 0.2, -hd + d * 0.28 + 20, g.D(c.mid), 4);
      g.box(-mw / 2, -hd + d * 0.1, mw / 2, -hd + d * 0.1 + Math.max(25, d * 0.06), g.D(TONE.screen), 6);
      g.box(-mw * 0.35, d * 0.02, mw * 0.35, d * 0.02 + d * 0.2, g.D(c.soft), 10);
    }
  }

  // ================================================================== symbols — storage
  /** Vertical module lines with small handles near the front (drawers / doors). */
  function frontModules(g, n, handles) {
    const { hw, hd, w, d } = g;
    const step = w / n;
    for (let i = 1; i < n; i++) g.line(-hw + i * step, -hd + d * 0.12, -hw + i * step, hd);
    if (!handles) return;
    for (let i = 0; i < n; i++) {
      const cx = -hw + (i + 0.5) * step;
      g.line(cx - step * 0.15, hd - d * 0.08, cx + step * 0.15, hd - d * 0.08, g.S(INK, 1.2));
    }
  }

  function paintCabinet(g, moduleW) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 10);
    g.line(-hw, -hd + d * 0.12, hw, -hd + d * 0.12);
    frontModules(g, Math.max(1, Math.round(w / moduleW)), true);
  }

  function paintSideboard(g) {
    paintCabinet(g, 450);
  }
  function paintDresser(g) {
    paintCabinet(g, 400);
  }

  function paintNightstand(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 12);
    g.line(-hw + 20, hd - d * 0.14, hw - 20, hd - d * 0.14);
    g.line(-w * 0.15, hd - d * 0.07, w * 0.15, hd - d * 0.07, g.S(INK, 1.2));
    const r = Math.min(w, d) * 0.26;
    g.circle(0, -d * 0.08, r, g.D(c.soft));
    g.line(-r * 0.7, -d * 0.08 - r * 0.7, r * 0.7, -d * 0.08 + r * 0.7);
    g.line(-r * 0.7, -d * 0.08 + r * 0.7, r * 0.7, -d * 0.08 - r * 0.7);
  }

  function paintWardrobe(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 8);
    // clothes on hangers + rod (dashed: above the section plane)
    const rodY = -d * 0.06;
    const hang = d * 0.3;
    const step = clamp(w / 22, 60, 130);
    for (let x = -hw + 90; x <= hw - 90; x += step) {
      g.line(x - hang * 0.12, rodY - hang, x + hang * 0.12, rodY + hang, g.S(c.deep, LW_DET * 0.9));
    }
    g.line(-hw + 50, rodY, hw - 50, rodY, g.S(INK, LW_DET * 1.2, g.dash(6, 3)));
    // sliding doors on two tracks
    const t = clamp(d * 0.045, 16, 32);
    const leaves = Math.max(2, Math.round(w / 900));
    const lw = w / leaves;
    for (let i = 0; i < leaves; i++) {
      const outer = i % 2 === 0;
      const y1 = hd - (outer ? t * 0.4 : t * 1.8);
      const x0 = -hw + i * lw - (outer ? 0 : 40);
      const x1 = -hw + (i + 1) * lw + (outer ? 0 : 40);
      g.box(Math.max(-hw, x0), y1 - t, Math.min(hw, x1), y1, g.D(c.mid));
    }
    g.box(-hw, -hd, hw, hd, g.O(null), 8);
  }

  function paintClosetIsland(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 12);
    const inset = clamp(Math.min(w, d) * 0.12, 30, 90);
    g.box(-hw + inset, -hd + inset, hw - inset, hd - inset, g.D(TONE.glass), 8);
    const n = Math.max(1, Math.round(w / 400));
    for (let i = 1; i < n; i++) {
      const x = -hw + (i * w) / n;
      g.line(x, -hd, x, -hd + inset);
      g.line(x, hd - inset, x, hd);
    }
  }

  function paintBookshelf(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 6);
    const n = Math.max(1, Math.round(w / 420));
    const step = w / n;
    for (let i = 0; i < n; i++) {
      const x0 = -hw + i * step + 20, x1 = -hw + (i + 1) * step - 20;
      let x = x0;
      let k = 0;
      while (x < x1 - 40) {
        const bw = Math.min(x1 - x, 30 + ((i * 7 + k * 13) % 5) * 9);
        g.box(x, -hd + d * 0.12, x + bw, hd - d * 0.18 - ((k * 11) % 3) * d * 0.06, g.D(k % 3 ? c.soft : c.mid));
        x += bw + 6;
        k++;
      }
      if (i > 0) g.line(-hw + i * step, -hd, -hw + i * step, hd, g.S(INK, LW_DET * 1.4));
    }
    g.box(-hw, -hd, hw, hd, g.O(null), 6);
  }

  function paintTvUnit(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 10);
    frontModules(g, Math.max(1, Math.round(w / 600)), true);
    const sw = Math.min(w * 0.82, 1450);
    const th = clamp(d * 0.12, 25, 60);
    const ty = -hd + d * 0.3;
    g.box(-sw * 0.16, ty - 35, sw * 0.16, ty + th + 70, g.D(c.mid), 12);
    g.box(-sw / 2, ty, sw / 2, ty + th, g.O(TONE.screen), 6);
    g.line(-sw / 2 + 15, ty + th + 6, sw / 2 - 15, ty + th + 6, g.S(TONE.glassLine, 1.2));
  }

  function paintFloorLamp(g) {
    const { hw, hd, c } = g;
    g.ellipse(0, 0, hw * 0.98, hd * 0.98, g.O(c.soft));
    g.ellipse(0, 0, hw * 0.55, hd * 0.55, g.D(c.fill));
    const k = Math.SQRT1_2;
    g.line(-hw * 0.98 * k, -hd * 0.98 * k, hw * 0.98 * k, hd * 0.98 * k);
    g.line(-hw * 0.98 * k, hd * 0.98 * k, hw * 0.98 * k, -hd * 0.98 * k);
    g.circle(0, 0, Math.min(hw, hd) * 0.12, g.D(c.deep));
  }

  // ================================================================== symbols — beds
  function paintBed(g) {
    const { hw, hd, w, d, c } = g;
    const hb = clamp(d * 0.05, 50, 110);
    const inset = clamp(w * 0.02, 12, 30);
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 30);
    g.box(-hw, -hd, hw, -hd + hb, g.D(c.deep), 20);
    const mx0 = -hw + inset, mx1 = hw - inset, my0 = -hd + hb + 10, my1 = hd - inset;
    g.box(mx0, my0, mx1, my1, g.D(c.soft), 40);
    // pillows
    const n = w >= 1150 ? 2 : 1;
    const pd = clamp(d * 0.14, 150, 330);
    const pg = clamp(w * 0.03, 20, 50);
    const pw = (mx1 - mx0 - (n + 1) * pg) / n;
    for (let i = 0; i < n; i++) {
      const x0 = mx0 + pg + i * (pw + pg);
      g.box(x0, my0 + 45, x0 + pw, my0 + 45 + pd, g.D(PAPER), Math.min(80, pd * 0.35));
      g.line(x0 + pw * 0.12, my0 + 45 + pd / 2, x0 + pw * 0.88, my0 + 45 + pd / 2, g.S(c.mid, LW_DET * 0.8));
    }
    // duvet with turned-down sheet and a folded corner
    const dy0 = Math.min(my1 - 100, my0 + 45 + pd + 80);
    const band = clamp(d * 0.07, 60, 160);
    g.box(mx0, dy0, mx1, my1, g.D(c.mid), 30);
    g.box(mx0, dy0, mx1, Math.min(my1, dy0 + band), g.D(c.soft), 20);
    const f = Math.min((mx1 - mx0) * 0.3, (my1 - dy0 - band) * 0.45);
    if (f > 40) {
      const fy = dy0 + band;
      g.poly([[mx1 - f, fy], [mx1, fy], [mx1, fy + f]], g.D(c.soft));
      g.line(mx1 - f, fy, mx1, fy + f, g.S(INK, LW_DET));
    }
    g.box(-hw, -hd, hw, hd, g.O(null), 30);
  }

  // ================================================================== symbols — kitchen & service
  function paintCounterTop(g) {
    const { hw, hd, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.stone), 6);
    g.line(-hw, -hd + clamp(d * 0.03, 10, 20), hw, -hd + clamp(d * 0.03, 10, 20), g.S(INK, LW_DET * 0.8));
    g.line(-hw, hd - clamp(d * 0.04, 12, 28), hw, hd - clamp(d * 0.04, 12, 28), g.S(c.fill, LW_DET * 1.6));
  }

  function paintCounter(g) {
    paintCounterTop(g);
  }

  function paintKitchenSink(g) {
    const { hw, hd, w, d, c } = g;
    paintCounterTop(g);
    const bw = clamp(w * 0.34, 300, 800);
    const bd = clamp(d * 0.62, 250, 460);
    const cy = d * 0.04;
    // drainer grooves on the left of the bowl
    const dr = Math.min(460, hw - bw / 2 - 80);
    if (dr > 150) {
      const x1 = -bw / 2 - 50, x0 = x1 - dr;
      g.box(x0, cy - bd / 2, x1, cy + bd / 2, g.D(TONE.steel), 20);
      for (let y = cy - bd / 2 + 45; y < cy + bd / 2 - 30; y += 45) g.line(x0 + 30, y, x1 - 25, y, g.S(INK, LW_DET * 0.8));
    }
    g.box(-bw / 2, cy - bd / 2, bw / 2, cy + bd / 2, g.D(TONE.steel), 45);
    g.box(-bw / 2 + 22, cy - bd / 2 + 22, bw / 2 - 22, cy + bd / 2 - 22, g.D(null), 35);
    g.circle(0, cy + bd * 0.12, Math.min(bw, bd) * 0.06, g.D(c.stone));
    // tap
    const ty = cy - bd / 2 - 40;
    g.circle(0, ty, 22, g.D(TONE.steel));
    g.line(0, ty, 0, cy - bd / 2 + 70, g.S(INK, 2));
    g.line(22, ty, 60, ty - 12, g.S(INK, 1.4));
  }

  function paintStove(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 12);
    const top = -hd + d * 0.04, bot = hd - d * 0.14;
    g.box(-hw + w * 0.04, top, hw - w * 0.04, bot, g.D(TONE.charcoal), 10);
    const m = Math.min(w, bot - top);
    const burner = (x, y, r) => {
      g.circle(x, y, r, g.D(c.mid));
      g.circle(x, y, r * 0.55, g.D(TONE.charcoal));
      g.line(x - r, y, x + r, y, g.S(INK, LW_DET * 0.8));
      g.line(x, y - r, x, y + r, g.S(INK, LW_DET * 0.8));
    };
    const cy = (top + bot) / 2;
    const dx = w * 0.27, dy = (bot - top) * 0.26;
    [[-dx, cy - dy], [dx, cy - dy], [-dx, cy + dy], [dx, cy + dy]].forEach(([x, y]) => burner(x, y, m * 0.11));
    burner(0, cy, m * 0.14);
    for (let i = 0; i < 5; i++) g.circle(-hw + ((i + 0.5) * w) / 5, hd - d * 0.07, Math.min(22, w * 0.03), g.D(c.deep));
  }

  function paintFridge(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 18);
    const t = clamp(d * 0.07, 30, 60);
    g.box(-hw, hd - t, hw, hd, g.D(c.mid), 8);
    g.line(0, hd - t, 0, hd);
    g.line(-w * 0.08, hd - t - 25, -w * 0.08, hd - t - 5, g.S(INK, 1.6));
    g.line(w * 0.08, hd - t - 25, w * 0.08, hd - t - 5, g.S(INK, 1.6));
    g.line(-hw + 40, -hd + 40, hw - 40, hd - t - 40, g.S(c.mid, LW_DET));
    g.line(-hw + 40, hd - t - 40, hw - 40, -hd + 40, g.S(c.mid, LW_DET));
  }

  /** Elevated element: dashed outline + diagonal cross (drafting convention for items above the cut). */
  function paintUpperCabinet(g) {
    const { hw, hd, w, c } = g;
    const dash = g.dash(5, 3);
    g.alpha(0.55, () => g.box(-hw, -hd, hw, hd, g.F(c.fill)));
    g.box(-hw, -hd, hw, hd, g.S(INK, LW_OUT, dash));
    g.line(-hw, -hd, hw, hd, g.S(INK, LW_DET, dash));
    g.line(-hw, hd, hw, -hd, g.S(INK, LW_DET, dash));
    const n = Math.max(1, Math.round(w / 500));
    for (let i = 1; i < n; i++) g.line(-hw + (i * w) / n, -hd, -hw + (i * w) / n, hd, g.S(INK, LW_DET, dash));
  }

  function paintIsland(g) {
    const { hw, hd, d } = g;
    paintCounterTop(g);
    const ov = Math.min(300, d * 0.3);
    g.line(-hw, hd - ov, hw, hd - ov, g.S(INK, LW_DET, g.dash(5, 3)));
  }

  function paintWasher(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 18);
    const panel = -hd + d * 0.16;
    g.line(-hw, panel, hw, panel);
    g.circle(hw - w * 0.18, (-hd + panel) / 2, Math.min(w, d) * 0.045, g.D(c.mid));
    g.box(-hw + w * 0.1, -hd + d * 0.04, -hw + w * 0.45, panel - d * 0.04, g.D(TONE.screen), 6);
    const r = Math.min(w, d - d * 0.16) * 0.36;
    const cy = (panel + hd) / 2;
    g.circle(0, cy, r, g.D(TONE.steel));
    g.circle(0, cy, r * 0.68, g.D(TONE.glass));
  }

  /** Laundry tub (tanque): deep bowl at the back with drain, ribbed washboard sloping into it at the front, tap. */
  function paintTanque(g) {
    const { hw, hd, w, d, c } = g;
    const rim = clamp(Math.min(w, d) * 0.07, 25, 60);
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 18);
    const x0 = -hw + rim, x1 = hw - rim, y0 = -hd + rim * 1.4, y1 = hd - rim;
    const split = y0 + (y1 - y0) * 0.56; // bowl | washboard
    const br = clamp(Math.min(w, d) * 0.08, 10, 50);
    const bi = Math.min(rim * 0.6, (split - y0) * 0.2);
    g.box(x0, y0, x1, split, g.D(c.soft), br);
    g.box(x0 + bi, y0 + bi, x1 - bi, split - bi * 0.3, g.D(TONE.glass), br * 0.8);
    g.circle(0, (y0 + split) / 2 + (split - y0) * 0.12, Math.min(w, split - y0) * 0.07, g.D(TONE.steel));
    // washboard (esfregador): ribs parallel to the front edge, lip where it meets the bowl
    g.box(x0, split, x1, y1, g.D(c.mid), 8);
    const ribs = clamp(Math.round((y1 - split) / 28), 2, 14);
    for (let i = 1; i < ribs; i++) {
      const y = split + ((y1 - split) * i) / ribs;
      g.line(x0 + rim * 0.5, y, x1 - rim * 0.5, y, g.S(c.deep, LW_DET * 0.8));
    }
    g.line(x0, split, x1, split, g.S(INK, LW_DET * 1.4));
    // wall tap over the bowl
    const tx = -w * 0.18, ty = -hd + rim * 0.7;
    g.circle(tx, ty, clamp(w * 0.035, 10, 24), g.D(TONE.steel));
    g.line(tx, ty, tx, ty + clamp(d * 0.2, 40, 140), g.S(INK, 2));
    g.line(tx - clamp(w * 0.05, 12, 30), ty, tx + clamp(w * 0.05, 12, 30), ty, g.S(INK, 1.6));
  }

  function paintShelves(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.soft), 4);
    const p = clamp(Math.min(w, d) * 0.08, 20, 40);
    g.line(-hw + p, -hd + p, hw - p, hd - p, g.S(c.deep, LW_DET, g.dash(4, 3)));
    g.line(-hw + p, hd - p, hw - p, -hd + p, g.S(c.deep, LW_DET, g.dash(4, 3)));
    [[-hw, -hd], [hw - p, -hd], [-hw, hd - p], [hw - p, hd - p]].forEach(([x, y]) => g.box(x, y, x + p, y + p, g.D(c.deep)));
    const boxes = Math.max(1, Math.round(w / 320));
    const bw = (w - 2 * p) / boxes;
    for (let i = 0; i < boxes; i++) {
      const x0 = -hw + p + i * bw + 20;
      g.box(x0, -hd + p + 20, x0 + bw - 40, hd - p - 20 - (i % 2) * d * 0.12, g.D(c.fill), 6);
    }
  }

  // ================================================================== symbols — bathroom
  function paintToilet(g) {
    const { hw, hd, w, d, c } = g;
    const tankD = clamp(d * 0.28, 110, 220);
    const bowlCY = -hd + tankD + (d - tankD) * 0.48;
    const rx = hw * 0.92, ry = (d - tankD) * 0.5;
    g.ellipse(0, bowlCY, rx, ry, g.O(c.fill));
    g.ellipse(0, bowlCY + ry * 0.1, rx * 0.66, ry * 0.7, g.D(c.soft));
    g.ellipse(0, bowlCY + ry * 0.18, rx * 0.35, ry * 0.38, g.D(TONE.glass));
    g.box(-hw, -hd, hw, -hd + tankD, g.O(c.fill), 25);
    g.circle(0, -hd + tankD / 2, Math.min(w, tankD) * 0.12, g.D(c.mid));
  }

  function paintBasin(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 12);
    g.line(-hw, hd - d * 0.07, hw, hd - d * 0.07, g.S(c.mid, LW_DET));
    const rx = Math.min(hw * 0.62, 270), ry = Math.min(hd * 0.58, 190);
    const cy = d * 0.04;
    g.ellipse(0, cy, rx, ry, g.D(c.soft));
    g.ellipse(0, cy + ry * 0.05, rx * 0.8, ry * 0.76, g.D(TONE.glass));
    g.circle(0, cy + ry * 0.12, Math.min(rx, ry) * 0.08, g.D(c.mid));
    const ty = cy - ry - Math.min(40, (hd - ry) * 0.6);
    g.circle(0, ty, 18, g.D(TONE.steel));
    g.line(0, ty, 0, cy - ry + 45, g.S(INK, 1.8));
  }

  function paintShower(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.soft), 6);
    const m = Math.min(w, d);
    const inset = clamp(m * 0.03, 15, 30);
    g.box(-hw + inset, -hd + inset, hw - inset, hd - inset * 2.5, g.D(c.fill), 10);
    [[-hw, -hd], [hw, -hd], [-hw, hd], [hw, hd]].forEach(([x, y]) => g.line(x * 0.94, y * 0.94, 0, 0, g.S(c.deep, LW_DET * 0.7)));
    const dr = clamp(m * 0.05, 25, 55);
    g.circle(0, 0, dr, g.D(TONE.steel));
    g.line(-dr * 0.6, 0, dr * 0.6, 0, g.S(INK, LW_DET * 0.8));
    // glass on the front edge: fixed pane + sliding leaf
    const gy = hd - inset * 0.8;
    g.line(-hw, gy, hw * 0.1, gy, g.S(TONE.glassLine, 2.2));
    g.line(-hw * 0.1, gy - inset * 1.3, hw, gy - inset * 1.3, g.S(TONE.glassLine, 2.2));
    // shower head on the back wall
    const hr = clamp(m * 0.08, 40, 100);
    g.line(0, -hd, 0, -hd + hr * 1.4, g.S(INK, 1.4));
    g.circle(0, -hd + hr * 1.6, hr, g.D(TONE.steel));
    g.circle(0, -hd + hr * 1.6, hr * 0.55, g.D(null));
  }

  function paintBathtub(g) {
    const { hw, hd, w, d, c } = g;
    g.box(-hw, -hd, hw, hd, g.O(c.fill), 30);
    const t = clamp(Math.min(w, d) * 0.09, 45, 90);
    g.box(-hw + t, -hd + t, hw - t, hd - t, g.D(c.soft), Math.min((d - 2 * t) / 2, 220));
    g.circle(-hw + t + 90, 0, 26, g.D(TONE.steel));
    g.circle(-hw + t / 2, 0, Math.min(18, t * 0.35), g.D(TONE.steel));
    g.line(-hw + t / 2, 0, -hw + t + 40, 0, g.S(INK, 1.4));
