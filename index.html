    }
    tweenCamera(currentPose(), aerialHome(), 650, { home: true });
  }
  /**
   * Orbit mode: when the active floor changes, re-frame the new floor if the camera was on its automatic framing,
   * otherwise glide the target to the new floor keeping the user's view angle and distance.
   */
  function glideToFloor(floorId) {
    if (!S.orbit || S.tween || S.pendingAerial) return;
    const cur = currentPose();
    const home = aerialHome(floorId);
    if (S.atHome) {
      tweenCamera(cur, home, 560, { home: true });
      return;
    }
    const next = home.target;
    const dx = next.x - cur.target.x, dy = next.y - cur.target.y, dz = next.z - cur.target.z;
    const to = { pos: { x: cur.pos.x + dx, y: cur.pos.y + dy, z: cur.pos.z + dz }, target: next, up: { x: 0, y: 1, z: 0 } };
    tweenCamera(cur, to, 520, {});
  }
  /** After a layout change (split view, window resize): keep the automatic framing fitted to the new aspect. */
  function refitHome() {

    if (tw && tw.home) {

    }

  /** Keep the orbit camera above the ground and the target near the lot. */
  function constrainOrbit() {

    const t = S.orbit.target;
    const cx = P.clamp(t.x, -15, lot.w * MM + 15), cz = P.clamp(t.z, -15, lot.h * MM + 25), cy = P.clamp(t.y, 0, 14);
    if (cx !== t.x || cy !== t.y || cz !== t.z) {

      t.set(cx, cy, cz);

      S.camera.position.y += dy;
      S.camera.position.z += dz;

  function resize() {
    if (!S.ready || !S.container) return;
    const w = S.container.clientWidth, h = S.container.clientHeight;
    if (w < 2 || h < 2) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    if (S.size && S.size.w === w && S.size.h === h && S.size.dpr === dpr) return;
    S.size = { w, h, dpr };
    S.renderer.setPixelRatio(dpr);
    S.renderer.setSize(w, h, false);
    S.camera.aspect = w / h;
    S.camera.updateProjectionMatrix();
    refitHome();
    requestRender();
  }

  // ================================================================== walk mode (first person)
  const MOVE_KEYS = { KeyW: 'f', ArrowUp: 'f', KeyS: 'b', ArrowDown: 'b', KeyA: 'l', ArrowLeft: 'l', KeyD: 'r', ArrowRight: 'r' };
  const WALK_PITCH = -4 * DEG;
  const BOB_MM = 10;

  function initWalk() {
    S.walk = { enabled: false, locked: false, x: 0, y: 0, feet: 0, vz: 0, vel: { x: 0, y: 0 }, keys: new Set(), run: false, floorId: null, world: null, worldDoc: null, bob: 0, phase: 0, spawned: false };
    const plc = new S.PointerLockControls(S.camera, S.renderer.domElement);
    plc.pointerSpeed = 0.85;
    plc.addEventListener('lock', () => {
      S.walk.locked = true;
      updateWalkUI();
    });
    plc.addEventListener('unlock', () => {
      S.walk.locked = false;
      S.walk.keys.clear();
      S.walk.run = false;
      updateWalkUI();
      requestRender();
    });
    plc.addEventListener('change', requestRender);
    S.plc = plc;
  }
  function lockPointer() {
    if (!S.plc || !isWalking() || S.walk.locked) return;
    try {
      const r = S.plc.lock();
      if (r && typeof r.catch === 'function') r.catch((e) => console.warn('[view3d] pointer lock refused', e));
    } catch (e) {
      console.warn('[view3d] pointer lock unavailable', e);
    }

  }

  /** Colliders + walkable surfaces, rebuilt lazily whenever the document changed. */
  function ensureWalkWorld() {

    if (S.walk.world && S.walk.worldDoc === doc && !S.dirty.colliders) return S.walk.world;
    S.walk.world = { colliders: P.collectColliders(doc), ctx: P.surfaceContext(doc), floors: doc.floors };

  function spawnWalker(floorId) {

    S.camera.rotation.set(WALK_PITCH, sp.yaw, 0, 'YXZ');

  function syncWalkerCamera() {
    const w = S.walk;

  /** Pose of the walker's eye (for transitions that end in walk mode). */
  function walkPose() {
    if (!S.walk.spawned) spawnWalker(uiNow().floor);
    const w = S.walk;
    const yaw = new S.THREE.Euler().setFromQuaternion(S.camera.quaternion, 'YXZ').y;
    const d = P.dirFromYaw(yaw);
    const pos = { x: w.x * MM, y: (w.feet + WALK.eye) * MM, z: w.y * MM };
    return { pos, target: { x: pos.x + d.x, y: pos.y + Math.tan(WALK_PITCH), z: pos.z + d.y }, up: { x: 0, y: 1, z: 0 } };
  }
  function walkInput() {
    const k = S.walk.keys;
    const yaw = new S.THREE.Euler().setFromQuaternion(S.camera.quaternion, 'YXZ').y;
    const f = P.dirFromYaw(yaw);
    const r = { x: -f.y, y: f.x };
    let x = 0, y = 0;
    if (k.has('f')) (x += f.x), (y += f.y);
    if (k.has('b')) (x -= f.x), (y -= f.y);
    if (k.has('r')) (x += r.x), (y += r.y);
    if (k.has('l')) (x -= r.x), (y -= r.y);

  /** One frame of walking. → true while something moved (needs a render). */
  function stepWalk(dt) {

    if (!w.enabled || dt <= 0) return false;
    const want = walkInput();
    const k = 1 - Math.exp(-dt * 12);
    const vel = { x: P.lerp(w.vel.x, want.x, k), y: P.lerp(w.vel.y, want.y, k) };
    const speed = Math.hypot(vel.x, vel.y);
    const still = speed < 5 && !want.x && !want.y;
    const next = P.stepWalker({ x: w.x, y: w.y, feet: w.feet, vz: w.vz }, still ? { x: 0, y: 0 } : vel, dt, ensureWalkWorld());
    const moved = Math.abs(next.x - w.x) > 0.01 || Math.abs(next.y - w.y) > 0.01 || Math.abs(next.feet - w.feet) > 0.01;

    const bob = still ? w.bob * (1 - k) : Math.sin(phase) * BOB_MM * Math.min(1, speed / WALK.speed);
    Object.assign(w, { x: next.x, y: next.y, feet: next.feet, vz: next.vz, vel: still ? { x: 0, y: 0 } : vel, phase, bob });

    S.walk.floorId = f.id;
    if (uiNow().floor !== f.id) store().setUI({ floor: f.id });

  function applyCameraMode(mode) {

  function enterWalk() {

    S.atHome = false;
    S.walk.enabled = true;
    S.orbit.enabled = false;
    S.camera.fov = FOV_WALK;
    S.camera.near = 0.05;
    S.camera.updateProjectionMatrix();
    S.ambient.intensity = LIGHT.ambientWalk;
    S.hemi.intensity = LIGHT.hemiWalk;

    spawnWalker(uiNow().floor);
  }
  function leaveWalk() {

    S.camera.fov = FOV_ORBIT;
    S.camera.near = 0.1;
    S.camera.updateProjectionMatrix();
    S.ambient.intensity = LIGHT.ambient;
    S.hemi.intensity = LIGHT.hemi;
    S.hemi.groundColor.set(BOUNCE.orbit);

    if (S.el.cross) S.el.cross.hidden = !locked;

    S.container.classList.toggle('v3d-locked', locked);

  function onWalkKey(e, down) {

  // ================================================================== picking, hover & furniture drag (orbit mode)
  function ndc(e) {
    const r = S.canvas.getBoundingClientRect();
    return new S.THREE.Vector2(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  }
  function visibleRoots() {
    const out = [];

  }

    for (let p = o; p; p = p.parent) if (!p.visible) return false;
    return true;
  }

      if (u.openingId) return { ref: { kind: 'opening', id: u.openingId }, point };
      if (u.wallId) return { ref: { kind: 'wall', id: u.wallId }, point };
      if (u.roomId) return { ref: { kind: 'room', id: u.roomId }, point };

    const cur = uiNow().selection;
    if ((!ref && !cur) || sameRef(ref, cur)) return;
    store().setUI({ selection: ref });
  }
  function setHover(ref) {
    const cur = uiNow().hover;
    if ((!ref && !cur) || sameRef(ref, cur)) return;
    store().setUI({ hover: ref });
  }
  function clearHover() {

    if (S.hoverOwned) setHover(null);
    S.hoverOwned = false;
    setCursor('');
  }
  function setCursor(c) {

    if (!it) return;
    const planeY = floorOf(doc, it.floor).level * MM;
    const p = rayToPlane(e, planeY);
    if (!p) return;

      y: P.clamp(Math.round(p.z / MM + d.offY), 0, lot.h),
      rot: d.rot0,

      } catch (err) {

      }

  // ================================================================== render loop
  /** Haze starts beyond the house whatever the zoom, and always hides the edge of the ground. */
  function updateFog() {

      if (isWalking() && !S.tween) busy = stepWalk(dt) || busy;

        constrainOrbit();

  }

  }

  }

      completeTween();
      exitPointerLock();
      if (S.drag) endDrag(true);
    }

  }

    const m = mode === 'walk' ? 'walk' : 'orbit';
    if (DD.store && uiNow().cam3d !== m) store().setUI({ cam3d: m }); // the UI subscriber applies it
    else applyCameraMode(m);
  }

  /** Debug statistics (renderer info + object counts). */
  function stats() {
    if (!S.ready) return null;
    let meshes = 0;
    S.scene.traverse((o) => {
      if (o.isMesh) meshes++;
    });
    const r = S.renderer.info;
    return { meshes, calls: r.render.calls, triangles: r.render.triangles, geometries: r.memory.geometries, textures: r.memory.textures, furniture: S.furniture.size };
  }

  function exportPNG() {
    if (!S.ready) return null;
    try {
      flushRebuild();
      resize();
      if (S.pendingAerial && !S.tween) jumpHome();
      render();
      return S.renderer.domElement.toDataURL('image/png');
    } catch (e) {
      console.error('[view3d] PNG export failed', e);
      return null;
    }
  }

  // ================================================================== store subscriptions
  function markAllFloors(doc) {
    doc.floors.forEach((f) => S.dirty.floors.add(f.id));
  }
  /** A 3D furniture drag whose gesture was cancelled elsewhere (undo, floor change, import) must stop at once. */
  function abortDragIfCancelled(info) {
    if (!S.drag || !info || !(info.undo || info.redo || info.replaced || info.cancel)) return;
    S.drag = null;
    S.press = null;

    setCursor('');
    S.dirty.highlight = true;
  }
  function onDocChange(doc, prev, info) {

    const pending = S.dirty.floors.size > 0;

      S.dirty.furniture = true;
    }
    if (!prev || doc.site !== prev.site) S.dirty.site = true;
    const archChanged =
      !prev ||
      doc.walls !== prev.walls ||
      doc.openings !== prev.openings ||
      doc.roomSeeds !== prev.roomSeeds ||
      doc.separators !== prev.separators ||
      doc.stairs !== prev.stairs;
    if (archChanged) markAllFloors(doc); // per-floor signatures skip floors that did not change
    if (!prev || doc.furniture !== prev.furniture) S.dirty.furniture = true;
    S.dirty.colliders = true;
    requestRender();
  }

  // =================================================================== menus

        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    });
    dlg.addEventListener('close', () => {
      const back = S.dialogReturn;
      S.dialogReturn = null;
      if (back && typeof back.focus === 'function' && document.body.contains(back)) back.focus();
    });
    dlg.addEventListener('click', (e) => {
      if (e.target === dlg) closeDialog(dlg); // click on the backdrop
    });
    $$('[data-dialog-close]', dlg).forEach((b) => b.addEventListener('click', () => closeDialog(dlg)));
  }
  /** Accessible confirm dialog → Promise<boolean>. */
  function confirmDialog(opts) {
    const dlg = document.getElementById('dlg-confirm');
    if (!dlg) return Promise.resolve(window.confirm(opts.body));
    setText($('#dlg-confirm-title', dlg), opts.title);
    setText($('#dlg-confirm-body', dlg), opts.body);
    const ok = $('[data-dialog-confirm]', dlg);
    const cancel = $('[data-dialog-cancel]', dlg);
    setText(ok, opts.confirm || 'Confirmar');
    return new Promise((resolve) => {
      let settled = false;
      const finish = (value) => {
        if (settled) return;
        settled = true;
        ok.removeEventListener('click', onOk);
        cancel.removeEventListener('click', onCancel);
        dlg.removeEventListener('close', onClose);
        closeDialog(dlg);
        resolve(value);
      };
      const onOk = () => finish(true);
      const onCancel = () => finish(false);
      const onClose = () => finish(false);
      ok.addEventListener('click', onOk);
      cancel.addEventListener('click', onCancel);
      dlg.addEventListener('close', onClose);
      openDialog(dlg, cancel);
    });
  }

  // =================================================================== export / import / reset / theme

  const isDataURL = (v) => typeof v === 'string' && v.indexOf('data:image/') === 0;
  function exportPlan() {

    const url = call('plan2d', 'exportPNG', { scale: 2, background: true });

  /** 3D file name: the floor only when the view is cut at the active floor. */
  function export3DName() {

  }
  /**
   * Render the 3D view at EXPORT_3D_SCALE × its css size. view3d sizes its renderer from the container, so the
   * container is enlarged for one synchronous render and scaled back visually (no paint happens in between).
   */
  function render3DHiRes() {
    const host = S.el.view3d;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const k = host ? EXPORT_3D_SCALE / dpr : 1;
    const w = host ? host.clientWidth : 0;
    const h = host ? host.clientHeight : 0;
    const enlarge = k > 1.01 && w > 1 && h > 1;
    if (enlarge) {
      Object.assign(host.style, { width: w * k + 'px', height: h * k + 'px', right: 'auto', bottom: 'auto', transform: `scale(${1 / k})`, transformOrigin: '0 0', transition: 'none' });
      call('view3d', 'resize');
    }
    try {
      return call('view3d', 'exportPNG', { scale: EXPORT_3D_SCALE });
    } finally {
      if (enlarge) {
        ['width', 'height', 'right', 'bottom', 'transform', 'transformOrigin', 'transition'].forEach((p) => (host.style[p] = ''));
        call('view3d', 'resize');
      }
    }
  }
  /** Exports what the 3D camera shows. From the 2D view it opens the 3D view first, so the file matches the screen. */
  async function export3D() {
    if (is3DUnavailable()) return notify3DNotReady();
    if (!call('view3d', 'isReady')) return toast('A vista 3D ainda está carregando — tente exportar de novo em instantes.', 'info');
    if (ui().view === '2d') {
      toast('Abrindo a vista 3D para exportar a câmera atual…', 'info');
      await setView('3d');
      if (S.to3DCamera) await withTimeout(S.to3DCamera, TO3D_MS + 600);
      if (ui().view === '2d') return; // the user switched back meanwhile
    }
    const url = render3DHiRes();
    if (!isDataURL(url)) return toast('Não foi possível gerar a imagem 3D.', 'error');
    DD.persist.downloadDataURL(url, export3DName());
    const size = await imageSize(url);
    toast(size ? `Vista 3D exportada em PNG (${size.w} × ${size.h} px).` : 'Vista 3D exportada em PNG.', 'ok');
  }
  function imageSize(url) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => resolve({ w: img.naturalWidth, h: img.naturalHeight });
      img.onerror = () => resolve(null);
      img.src = url;

  // ----- local backup kept before a whole-project replacement (import / reset / recover)
  const backupKey = () => DD.persist.key + BACKUP_SUFFIX;
  function writeBackup(d) {
    try {
      localStorage.setItem(backupKey(), JSON.stringify({ savedAt: new Date().toISOString(), doc: d }));
      return true;
    } catch (err) {
      console.warn('[ui] backup failed', err);
      return false;
    }
  }
  function readBackupMeta() {
    try {
      const raw = localStorage.getItem(backupKey());
      return raw ? JSON.parse(raw) : null;
    } catch (err) {
      console.warn('[ui] backup unreadable', err);
      return null;
    }
  }
  function readBackup() {
    const parsed = readBackupMeta();
    const d = parsed ? DD.persist.validate(parsed.doc) : null;
    return d ? { doc: d, savedAt: parsed.savedAt } : null;
  }
  function syncBackupItem() {
    const item = $('[data-action="restore-backup"]');
    if (!item) return;
    const meta = readBackupMeta();
    const at = meta && meta.savedAt;
    item.hidden = !at;
    setText($('.menu-meta', item), at ? fmtSavedAt(at, new Date()) : '');
  }
  /** Replace the whole project; the current one is kept as the local backup (recoverable from the ⋯ menu). */
  function loadDocument(next, label) {
    flushNudge();
    call('plan2d', 'cancel');
    const kept = writeBackup(doc());
    DD.store.replace(next, label);
    const u = ui();
    const floor = floorOf(next, u.floor) ? u.floor : (next.floors[0] || {}).id;
    setUI({ floor, selection: null });
    call('plan2d', 'fit');
    syncBackupItem();
    return kept;
  }
  function onImportFile(e) {
    const input = e.target;
    const file = input.files && input.files[0];
    input.value = '';
    if (!file) return;
    if (file.size > MAX_IMPORT_BYTES) return toast('Arquivo grande demais para um projeto (máx. 10 MB).', 'error');
    DD.persist
      .readJSONFile(file)
      .then((next) => {
        const dropped = DD.persist.lastDropped || 0;
        if (!next.floors.length) throw new Error('O arquivo não contém pavimentos.');
        const kept = loadDocument(next, 'Importar projeto');
        const undoHint = kept ? 'O projeto anterior ficou guardado em “Mais opções › Recuperar projeto anterior”.' : 'Ctrl + Z desfaz a importação.';
        toast(`Projeto importado: ${file.name}. ${undoHint}`, 'ok');
        if (dropped > 0) toast(`${dropped} ${dropped === 1 ? 'item inválido foi ignorado' : 'itens inválidos foram ignorados'} na importação.`, 'warn');
      })
      .catch((err) => toast(err && err.message ? err.message : 'Não foi possível importar o arquivo.', 'error'));

      title: 'Recuperar projeto anterior?',

      confirm: 'Recuperar',

  // =================================================================== library
  function initLibrary() {
    const grid = document.getElementById('lib-grid');
    const cat = DD.catalog;
    grid.textContent = '';
    if (!cat || !cat.types || !Object.keys(cat.types).length) {
      grid.appendChild(h('p', { class: 'lib-empty', text: 'O catálogo de móveis ainda não está disponível.' }));
      return;
    }
    const order = (cat.categories || []).map((c) => c.id);
    const rank = (def) => (order.indexOf(def.category) < 0 ? order.length : order.indexOf(def.category));
    S.libCards = Object.keys(cat.types)
      .map((type) => ({ type, def: cat.types[type] }))
      .sort((a, b) => rank(a.def) - rank(b.def))
      .map(({ type, def }) => createLibCard(type, def));
    S.libCards.forEach((c) => grid.appendChild(c.el));
    syncLibraryFoot();
    if (window.matchMedia) {
      const mq = window.matchMedia(COARSE_MQ);

    }

    grid.appendChild(S.el.libEmpty);
    renderChips(cat);
    bindLibraryEvents(grid);
    filterLibrary();
    loadThumbnails(S.libCards.slice());

  /** HTML drag & drop does not exist on touch screens: say what a tap does there. */
  function syncLibraryFoot() {

  function createLibCard(type, def) {

      h('span', { class: 'lib-thumb' }, [img]),
      h('span', { class: 'lib-name', text: def.name }),
      h('span', { class: 'lib-size num', text: size }),
    ]);
    return { el, img, type, def, search: normSearch(`${def.name} ${categoryName(def.category)} ${type}`) };
  }
  function renderChips(cat) {
    const box = document.getElementById('lib-chips');

    cats.forEach((c) => {

      );

  function filterLibrary() {
    const q = normSearch(S.libQuery);
    let shown = 0;
    S.libCards.forEach((c) => {
      const visible = (S.libCategory === 'all' || c.def.category === S.libCategory) && (!q || c.search.indexOf(q) >= 0);
      c.el.hidden = !visible;
      if (visible) shown++;
    });
    if (S.el.libEmpty) S.el.libEmpty.hidden = shown > 0;
    setText(document.getElementById('lib-count'), `${shown} ${shown === 1 ? 'item' : 'itens'}`);
  }
  function loadThumbnails(queue) {
    const step = () => {
      queue.splice(0, THUMB_BATCH).forEach((card) => {
        const url = thumbURL(card.type);
        if (!url) return;
        card.img.addEventListener('load', () => card.img.classList.add('is-loaded'), { once: true });
        card.img.src = url;
      });
      if (queue.length) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function bindLibraryEvents(grid) {
    const search = document.getElementById('lib-search');
    let debounce = 0;
    search.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        S.libQuery = search.value;
        filterLibrary();
      }, 90);
    });
    search.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && search.value) {
        e.stopPropagation();
        search.value = '';
        S.libQuery = '';
        filterLibrary();
      }
    });
    grid.addEventListener('click', (e) => {
      const card = e.target.closest('.lib-card');
      if (card) addFromLibrary(card.getAttribute('data-type'));
    });
    grid.addEventListener('keydown', (e) => {
      const card = e.target.closest && e.target.closest('.lib-card');
      if (!card || (e.key !== 'Enter' && e.key !== ' ')) return;
      e.preventDefault();
      e.stopPropagation();
      addFromLibrary(card.getAttribute('data-type'));
    });
    grid.addEventListener('dragstart', onLibDragStart);
    grid.addEventListener('dragend', (e) => {
      const card = e.target.closest && e.target.closest('.lib-card');

  function onLibDragStart(e) {
    const card = e.target.closest && e.target.closest('.lib-card');
    if (!card || !e.dataTransfer) return;
    const type = card.getAttribute('data-type');
    e.dataTransfer.setData(DRAG_MIME, type);
    e.dataTransfer.setData('text/plain', type);
    e.dataTransfer.effectAllowed = 'copy';
    const img = $('img', card);
    if (img && img.complete && img.naturalWidth) e.dataTransfer.setDragImage(img, img.width / 2, img.height / 2);
    card.classList.add('is-dragging');
    hideTooltip();
    if (isNarrow()) setTimeout(() => closeDrawer(false), 0); // uncover the plan so the item can be dropped
  }
  const isFurnitureDrag = (e) => !!(e.dataTransfer && Array.from(e.dataTransfer.types || []).indexOf(DRAG_MIME) >= 0);
  function bindDropTarget(el, onDrop) {
    el.addEventListener('dragover', (e) => {
      if (!isFurnitureDrag(e)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
      el.classList.add('is-drop-target');
    });
    el.addEventListener('dragleave', (e) => {
      if (!el.contains(e.relatedTarget)) el.classList.remove('is-drop-target');
    });
    el.addEventListener('drop', (e) => {
      if (!isFurnitureDrag(e)) return;
      e.preventDefault();
      el.classList.remove('is-drop-target');
      onDrop(e.dataTransfer.getData(DRAG_MIME), e);
    });

  function afterAdd(type) {

  // ----- keep the whole floor in view when the 2D pane changes size (split view, docked paint bar)

    } catch (err) {

    const sx = (x) => (x - vp.cx) * vp.scale + vp.width / 2;
    const sy = (y) => (y - vp.cy) * vp.scale + vp.height / 2;

  // split divider
  function initDivider() {
    const div = S.el.divider;
    div.addEventListener('pointerdown', (e) => {
      if (ui().view !== 'split' || e.button !== 0) return;
      e.preventDefault();
      div.setPointerCapture(e.pointerId);
      S.el.stage.classList.add('is-resizing');
      const rect = S.el.stage.getBoundingClientRect();
      const move = (ev) => {
        setSplit((ev.clientX - rect.left) / rect.width);
        scheduleLayout();
      };
      const up = () => {
        div.removeEventListener('pointermove', move);
        div.removeEventListener('pointerup', up);
        div.removeEventListener('pointercancel', up);
        S.el.stage.classList.remove('is-resizing');
        scheduleLayout();
      };
      div.addEventListener('pointermove', move);
      div.addEventListener('pointerup', up);
      div.addEventListener('pointercancel', up);
    });
    div.addEventListener('dblclick', () => {
      setSplit(0.5);
      trackLayout(LAYOUT_ANIM_MS);
    });
    div.addEventListener('keydown', (e) => {
      const step = e.shiftKey ? 0.1 : 0.02;
      const moves = { ArrowLeft: S.split - step, ArrowRight: S.split + step, Home: SPLIT_MIN, End: SPLIT_MAX };
      if (!(e.key in moves)) return;
      e.preventDefault();
      e.stopPropagation();
      setSplit(moves[e.key]);
      scheduleLayout();
    });

  // =================================================================== inspector: mounting & sync
  function errorPanel() {
    const el = h('div', { class: 'insp-panel' }, [section(null, [h('p', { class: 'insp-note', text: 'Não foi possível exibir as propriedades deste item.' })])]);

  function refreshInspector() {
    if (!S.el.inspBody) return;
    const d = doc();
    const u = ui();
    const target = resolveSelection(d, u);
    if (u.selection && !target) scheduleStaleSelectionCheck();
    const kind = target ? target.kind : 'overview';
    const key = target ? kind + ':' + target.item.id : 'overview';
    if (key !== S.inspKey || !S.panel) mountPanel(kind, key, target);
    try {
      S.panel.sync(d, u, target && target.item);
    } catch (err) {
      console.error('[ui] inspector sync', err);
    }
    syncInspectorHead(kind, target);
  }
  function mountPanel(kind, key, target) {
    let panel;
    try {
      panel = PANEL_BUILDERS[kind](target ? target.item : null);
    } catch (err) {
      console.error('[ui] inspector build', kind, err);
      panel = errorPanel();
    }
    S.inspKey = key;
    S.panel = panel;
    S.el.inspBody.textContent = '';
    S.el.inspBody.appendChild(panel.el);
    S.el.inspBody.scrollTop = 0;
  }
  function syncInspectorHead(kind, target) {
    let title = PANEL_TITLES[kind] || 'Projeto';
    if (kind === 'opening' && target) title = target.item.type === 'door' ? 'Porta' : 'Janela';
    setText(document.getElementById('inspector-title'), title);
    const clear = document.getElementById('btn-clear-selection');
    if (clear) clear.hidden = !target;
    const dot = $('#btn-drawer-insp .dot');
    if (dot) dot.hidden = !target;
  }
  /** Coalesce inspector refreshes during drags (transient previews) to one per frame. */
  function scheduleInspector() {
    if (S.inspRaf) return;
    S.inspRaf = requestAnimationFrame(() => {
      S.inspRaf = 0;
      refreshInspector();
    });
  }
  function scheduleStaleSelectionCheck() {
    if (S.staleTimer) return;
    S.staleTimer = setTimeout(() => {
      S.staleTimer = 0;
      const u = ui();
      if (u.selection && !resolveSelection(doc(), u)) setUI({ selection: null });
    }, 0);
  }

  // =================================================================== status bar
  /** A project restored from the local save shows when it was saved (not a generic "autosave on"). */
  function syncRestoredSaveState() {
    if (DD.store.canUndo() || !DD.persist || typeof DD.persist.load !== 'function') return;
    const saved = DD.persist.load();
    if (saved && saved.savedAt && !isNaN(new Date(saved.savedAt).getTime())) setSaveState('saved', saved.savedAt);
  }
  function initStatusbar() {
    document.getElementById('btn-zoom-in').addEventListener('click', () => call('plan2d', 'zoomBy', ZOOM_STEP));
    document.getElementById('btn-zoom-out').addEventListener('click', () => call('plan2d', 'zoomBy', 1 / ZOOM_STEP));
    document.getElementById('btn-fit').addEventListener('click', () => call('plan2d', 'fit'));
    document.getElementById('tg-snap').addEventListener('click', () => setUI({ snap: !ui().snap }));
    [
      ['tg-grid', 'grid'],
      ['tg-dims', 'dims'],
      ['tg-labels', 'labels'],
    ].forEach(([elId, key]) => document.getElementById(elId).addEventListener('click', () => toggleShow(key)));
    DD.events.on('plan2d:cursor', onCursor);
    DD.events.on('plan2d:viewport', syncZoom);
    DD.events.on('saved', (p) => setSaveState('saved', p && p.at));
    DD.events.on('doc:committed', () => setSaveState('pending'));
  }
  function onCursor(p) {
    const pt = p && (p.world || p);
    S.cursorPoint = pt && isFinite(pt.x) && isFinite(pt.y) ? { x: pt.x, y: pt.y } : null;
    if (S.cursorRaf) return;
    S.cursorRaf = requestAnimationFrame(() => {
      S.cursorRaf = 0;
      setText(document.getElementById('status-coords'), formatCursor(S.cursorPoint));
    });

  function syncZoom() {

  const STATUS_3D = {
    orbit: 'Clique num móvel para selecionar · arraste-o para mover · Q volta à planta 2D',
    walk: 'Clique na vista para caminhar · Esc sai do modo caminhar · Q volta à planta 2D',
  };
  /** Status bar: the active 2D tool, or — in the 3D-only view — the camera mode (2D-only groups hide via CSS). */
  function syncStatus(u, view) {
    const is3d = (view || S.appliedView || u.view) === '3d';
    const tool = TOOL_BY_ID[u.tool] || TOOLS[0];
    const cam = CAM_MODES.find((m) => m.id === u.cam3d) || CAM_MODES[0];
    const key = is3d ? '3d:' + cam.id : tool.id;
    const toolEl = document.getElementById('status-tool');
    if (toolEl.getAttribute('data-tool') !== key) {
      toolEl.setAttribute('data-tool', key);
      toolEl.textContent = '';
      toolEl.appendChild(icon(is3d ? 'cube' : tool.icon));
      toolEl.appendChild(document.createTextNode(' ' + (is3d ? 'Vista 3D · ' + cam.label : tool.id === 'pan' ? 'Mover a vista' : tool.label)));
    }
    setText(document.getElementById('status-hint'), is3d ? STATUS_3D[cam.id] || STATUS_3D.orbit : tool.hint);
    const show = u.show || {};
    setPressed(document.getElementById('tg-snap'), !!u.snap);
    setPressed(document.getElementById('tg-grid'), !!show.grid);
    setPressed(document.getElementById('tg-dims'), !!show.dims);
    setPressed(document.getElementById('tg-labels'), !!show.labels);
  }
  function setSaveState(state, at) {
    const box = document.getElementById('save-state');
    const txt = document.getElementById('save-text');
    if (!box || !txt) return;
    clearTimeout(S.saveTimer);
    box.setAttribute('data-state', state);
    if (state === 'saved') {
      const when = at ? new Date(at) : new Date();
      setText(txt, 'Salvo ' + fmtSavedAt(when, new Date()));
      box.title = 'Salvo neste navegador em ' + fmtSavedAt(when, new Date(), true);
      return;
    }
    box.removeAttribute('title');
    if (state === 'unsaved') setText(txt, 'Alterações não salvas');
    else if (state === 'pending') {
      setText(txt, 'Salvando…');
      S.saveTimer = setTimeout(() => setSaveState('unsaved'), SAVE_STALL_MS);
    }
  }

  // =================================================================== drawers (narrow layouts) & library column
  function initDrawers() {
    document.getElementById('btn-drawer-lib').addEventListener('click', () => toggleDrawer('library'));
    document.getElementById('btn-drawer-insp').addEventListener('click', () => toggleDrawer('inspector'));
    document.getElementById('scrim').addEventListener('click', () => closeDrawer(false));
    $$('[data-close-drawer]').forEach((b) => b.addEventListener('click', () => closeDrawer(true)));
    document.getElementById('btn-clear-selection').addEventListener('click', () => select(null));
    if (window.matchMedia) {
      const mq = window.matchMedia(NARROW_MQ);
      const onChange = () => {
        if (!mq.matches) closeDrawer(false);
        syncLibraryToggle();
        scheduleLayout();
      };
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    }
  }
  function toggleLibrary() {
    if (isNarrow()) toggleDrawer('library');
    else {
      document.getElementById('workspace').classList.toggle('lib-collapsed');
      syncLibraryToggle();
      trackLayout(LAYOUT_ANIM_MS + 60);
    }
  }
  function syncLibraryToggle() {
    const open = isNarrow() ? S.drawer === 'library' : !document.getElementById('workspace').classList.contains('lib-collapsed');
    setPressed(S.el.libToggle, open);
  }
  function toggleDrawer(name) {
    if (S.drawer === name) closeDrawer(true);
    else openDrawer(name);
  }
  /**
   * Focus moves to the drawer's title (tabindex -1), never onto an action such as "Limpar seleção" that Enter
   * would trigger. On touch nothing is focused: no on-screen keyboard, no focus ring.
   */
  function openDrawer(name) {
    closeAllMenus();
    hideTooltip();
    S.drawerReturn = document.activeElement;
    S.drawer = name;
    applyDrawers();
    if (S.lastPointerType === 'touch' && !S.keyboardNav) return;
    requestAnimationFrame(() => {
      const title = document.getElementById(name === 'library' ? 'library-title' : 'inspector-title');
      if (title && S.drawer === name) title.focus({ preventScroll: true });
    });
  }
  function closeDrawer(returnFocus) {
    if (!S.drawer) return;
    S.drawer = null;
    applyDrawers();
    const back = S.drawerReturn;
    S.drawerReturn = null;
    if (returnFocus && back && typeof back.focus === 'function' && document.body.contains(back)) back.focus();
  }
  function applyDrawers() {
    const lib = S.drawer === 'library';
    const insp = S.drawer === 'inspector';
    document.getElementById('library').classList.toggle('is-open', lib);
    document.getElementById('inspector').classList.toggle('is-open', insp);
    document.getElementById('scrim').hidden = !S.drawer;
    document.getElementById('btn-drawer-lib').setAttribute('aria-expanded', lib ? 'true' : 'false');
    document.getElementById('btn-drawer-insp').setAttribute('aria-expanded', insp ? 'true' : 'false');
    syncLibraryToggle();
  }

  // =================================================================== keyboard
  function initKeyboard() {
    document.addEventListener('keydown', onKeyDown);
    // Close a pending arrow-key nudge before any pointer interaction starts its own gesture (2D or 3D drag,
    // paint / demolish / measure click): capture phase runs before the canvases' own pointerdown handlers.
    document.addEventListener('pointerdown', flushNudge, true);
  }
  const isSaveCombo = (e) => (e.ctrlKey || e.metaKey) && !e.altKey && String(e.key).toLowerCase() === 's';
  /** Ctrl+S from a field: commit what was typed (blur fires 'change'), save, and give the field its focus back. */
  function saveFromField(field) {
    const typing = field && isTypingTarget(field) && typeof field.blur === 'function';
    if (typing) field.blur();
    saveNow();
    if (typing && field.isConnected && typeof field.focus === 'function') field.focus({ preventScroll: true });
  }
  /** Document edits a key may trigger: ignored while a pointer drag owns the store gesture (it would be lost). */
  const EDIT_ACTIONS = { delete: true, duplicate: true, rotate: true, nudge: true, undo: true, redo: true };
  function onKeyDown(e) {
    if (e.defaultPrevented || isModalOpen() || S.openMenu) return;
    if (isSaveCombo(e)) {
      e.preventDefault(); // never the browser's "Save page" dialog, not even from an input
      if (!e.repeat) saveFromField(document.activeElement);
      return;
    }
    if (document.pointerLockElement) return;
    if (e.key === 'Escape' && S.drawer) {
      e.preventDefault();
      closeDrawer(true);
      return;
    }
    if (isTypingTarget(e.target)) return;
    const u = ui();
    const action = keyToAction(e, { walkMode: u.cam3d === 'walk' && u.view !== '2d' });
    if (!action) return;
    e.preventDefault();
    if (e.repeat && !REPEATABLE_ACTIONS[action.type]) return;
    if (EDIT_ACTIONS[action.type] && pointerGestureActive()) return;
    runAction(action);
  }
  /** 2D-only actions in the 3D-only view: nothing would visibly happen, so say how to get back to the plan. */
  function planOnly() {
    if (!planHidden()) return false;
    toast(MSG_PLAN_ONLY, 'info');
    return true;
  }
  function runAction(a) {
    const fid = () => selectedFurnitureId();
    const handlers = {
      tool: () => planOnly() || setTool(a.tool),
      undo: doUndo,
      redo: doRedo,
      save: saveNow,
      duplicate: () => fid() && duplicateFurniture(fid()),
      escape: escapeAction,
      delete: deleteSelection,
      shortcuts: openShortcuts,
      rotate: () => fid() && rotateFurniture(fid(), a.delta),
      view: () => setView(nextView(ui().view, a.mode)),
      floor: () => {
        const f = doc().floors[a.index];
        if (f) setFloor(f.id);
      },
      fit: () => (planHidden() ? recenter3D() : call('plan2d', 'fit')),
      zoom: () => planOnly() || call('plan2d', 'zoomBy', a.factor),
      grid: () => planOnly() || toggleShow('grid'),
      nudge: () => nudgeSelection(a.dx, a.dy),
    };
    const fn = handlers[a.type];
    if (fn) fn();
  }

  // =================================================================== store subscriptions
  function onDocChange(d, prev, info) {
    if (info && info.transient) {
      scheduleInspector();
      return;
    }
    if (d.floors !== prev.floors) renderFloorTabs();
    else if (d.walls !== prev.walls || d.roomSeeds !== prev.roomSeeds || d.separators !== prev.separators) updateFloorAreas();
    if (d.meta !== prev.meta) syncProjectName();
    syncHistory();
    refreshInspector();
  }
  function onUIChange(u, prev) {
    if (S.ready && u.view !== S.appliedView) setView(u.view);
    if (u.floor !== prev.floor) syncFloorTabs();
    if (u.tool !== prev.tool || u.snap !== prev.snap || u.show !== prev.show || u.cam3d !== prev.cam3d) syncStatus(u);
    if (u.tool !== prev.tool) syncToolRail(u);
    if (u.tool !== prev.tool || u.paintMaterial !== prev.paintMaterial) syncPaintStrip(u);
    if (u.cam3d !== prev.cam3d || u.showAllFloors !== prev.showAllFloors) syncOverlay(u);
    if (u.selection !== prev.selection || u.floor !== prev.floor) refreshInspector();
  }

  // =================================================================== lifecycle
  /** Bind the DOM from shell.html. Must run before plan2d/view3d init (it does not call them). */
  function init() {
    if (S.initialized) return;
    if (!DD.store) {
      console.error('[ui] DD.store ausente — a interface não pode ser iniciada.');
      return;
    }
    S.initialized = true;
    applyStoredTheme();
    hydrateIcons(document);
    S.el.inspBody = document.getElementById('inspector-body');
    initTooltips();
    initTopbar();
    renderToolRail();
    renderFloorTabs();
    initStage();
    renderOverlay();
    initLibrary();
    initStatusbar();
    initDrawers();
    renderShortcuts();
    $$('dialog.dialog').forEach(initDialog);
    initKeyboard();
    DD.events.on('toast', (p) => p && showToast(p.msg, p.kind));
    DD.store.subscribe(onDocChange);
    DD.store.subscribeUI(onUIChange);
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: light)');
      if (mq.addEventListener) mq.addEventListener('change', syncThemeLabel);
    }
    const u = ui();
    S.el.stage.setAttribute('data-view', u.view);
    S.el.app.setAttribute('data-view', u.view);
    syncViewToggle(u.view);
    syncProjectName();
    syncHistory();
    syncToolRail(u);
    syncStatus(u);
    syncOverlay(u);
    syncPaintStrip(u);
    syncThemeLabel();
    syncLibraryToggle();
    refreshInspector();
  }
  /** Called by boot after plan2d/view3d init: apply the initial view and pull state from the other modules. */
  function ready() {
    if (!S.initialized) init();
    if (!S.initialized || S.ready) return;
    S.ready = true;
    ensureOverlayAttached();
    setSplit(S.split);
    const view = ui().view;
    S.appliedView = view;
    applyViewInstant(view);
    syncViewContext(view);
    syncZoom();
    syncRestoredSaveState();
    syncBackupItem();
    call('materials', 'prewarm');
    S.inspKey = null; // rebuild so thumbnails/material swatches from late modules show up
    refreshInspector();
  }

  DD.ui = {
    init,
    ready,
    setView,
    showToast,
    /** Pure helpers, exposed for tests (tools/test-ui.js). */
    util: {
      parseDecimal,
      parseMM,
      parseMeters,
      parseLength,
      parseDegrees,
      furnitureEdit,
      thicknessEdit,
      openingWidthEdit,
      wallFreeSpan,
      findFreeT,
      viewportShowsBox,
      punctuate,
      fmtSavedAt,
      slug,
      floorTabLabel,
      formatCursor,
      zoomPercent,
      fmtTime,
      normHex,
      isTypingTarget,
      nudgeDelta,
      keyToAction,
      nextView,
      LIMITS,
      STYLE_MAX,
      WALL_KIND,
    },
  };
})();

// ---- 99-boot.js ----
// ===== 99-boot.js — wires the modules together =====
(function () {
  const DD = window.DD;

  function start() {
    let doc = null;
    let restored = null;
    const saved = DD.persist.load();
    if (saved) {
      doc = saved.doc;
      restored = saved.savedAt;
    } else {
      doc = DD.data.initialState();
      try {
        doc.furniture = DD.catalog.defaultLayout(doc);
      } catch (e) {
        console.error('defaultLayout failed', e);
        doc.furniture = [];
      }
    }
    DD.store = DD.createStore(doc, DD.defaultUI());

    // autosave (debounced) after every committed change
    const autosave = DD.util.debounce(() => {
      if (DD.persist.save(DD.store.doc)) DD.events.emit('saved', { auto: true, at: new Date() });
    }, 800);
    DD.events.on('doc:committed', autosave);

    const step = (name, fn) => {
      try {
        fn();
      } catch (e) {
        console.error('[boot] ' + name + ' failed', e);
        DD.toast('Falha ao iniciar ' + name + ': ' + (e && e.message ? e.message : e), 'error');
      }
    };
    step('interface', () => DD.ui.init());
    step('planta 2D', () => DD.plan2d.init(document.getElementById('plan-canvas')));
    step('vista 3D', () => DD.view3d.init(document.getElementById('view3d'))); // async: lazy-loads three.js
    step('interface', () => DD.ui.ready && DD.ui.ready());

    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => DD.plan2d.redraw());
    if (restored) {
      const when = new Date(restored);
      DD.toast('Projeto restaurado do salvamento local (' + when.toLocaleString('pt-BR') + ').', 'info');
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
